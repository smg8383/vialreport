<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<!-- 🔥 IMPORTANTE RESPONSIVE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ingreso - Vial Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
body{
  background: url('https://www.ceupe.com/images/easyblog_articles/3984/b2ap3_large_ruta-de-transporte.png') no-repeat center center/cover;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: 'Segoe UI', sans-serif;
  padding:15px 15px 65px 15px;
  position:relative;
}

/* 🔥 OSCURECER FONDO (MEJORA VISUAL) */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.45);
  top:0;
  left:0;
}

/* CONTENEDOR */
.card{
  width:100%;
  max-width:390px;
  padding:26px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.32);
  background:white;
  animation: fadeIn 0.45s ease;
  position:relative;
  z-index:2;
}

/* ANIMACIÓN */
@keyframes fadeIn {
  from {opacity:0; transform:translateY(16px);}
  to {opacity:1; transform:translateY(0);}
}

/* INPUTS */
.form-control{
  border-radius:10px;
  padding:10px 12px;
}

.input-group .form-control{
  border-top-right-radius:0;
  border-bottom-right-radius:0;
}

.input-group .btn-toggle-pass{
  border-top-left-radius:0;
  border-bottom-left-radius:0;
  border-top-right-radius:10px;
  border-bottom-right-radius:10px;
  border-color:#dee2e6;
}

/* BOTONES */
#btnLogin{
  border-radius:10px;
  padding:10px;
  font-weight:600;
}

/* LOGO */
.logo{
  width:100%;
  max-width:110px;
  display:block;
  margin:0 auto 10px auto;
}

/* FOOTER */
footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  text-align:center;
  font-size:12px;
  background:rgba(255,255,255,0.92);
  padding:6px 10px;
  border-top:1px solid #ddd;
  z-index:2;
}

/* 📱 MOBILE EXTRA */
@media (max-width: 480px){
  .card{
    padding:20px;
  }

  h5{
    font-size:18px;
  }

  h6{
    font-size:14px;
  }
}
</style>

<!-- Configuración PWA / Pantalla completa iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vial Report">
<link rel="apple-touch-icon" href="https://res.cloudinary.com/ddgc2azm8/image/upload/v1775232056/logo2_fnyfpq.png">

<link rel="manifest" href="manifest.json">
</head>

<body>

<div class="card">
  <div id="loginBox">
    <img src="https://res.cloudinary.com/ddgc2azm8/image/upload/v1775232056/logo2_fnyfpq.png" class="logo" alt="Logo Vial Report">

    <h5 class="text-center text-primary fw-bold mb-1">VIAL REPORT</h5>
    <h6 class="mb-3 text-center text-muted">Acceso de usuarios habilitados</h6>

    <div id="alertaLogin" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

    <div class="mb-2">
      <label for="email" class="form-label small fw-semibold text-secondary mb-1">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" class="form-control" placeholder="usuario@empresa.com">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label small fw-semibold text-secondary mb-1">Contraseña</label>
      <div class="input-group">
        <input id="password" type="password" autocomplete="current-password" class="form-control" placeholder="••••••••">
        <button type="button" id="btnTogglePass" class="btn btn-outline-secondary btn-toggle-pass" title="Mostrar u ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
          <i id="iconoPass" class="bi bi-eye"></i>
        </button>
      </div>
    </div>

    <button id="btnLogin" type="button" class="btn btn-primary w-100">
      <span id="btnLoginTexto">Ingresar</span>
      <span id="btnLoginSpinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status"></span>
    </button>

    <div class="text-center mt-3">
      <small class="text-muted">El alta de cuentas es administrada por Vial Report.</small>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://yepethuzzretakioqyqy.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllcGV0aHV6enJldGFraW9xeXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NTQwMDcsImV4cCI6MjA5MDUzMDAwN30.1sRjLDe56C7ILa6n3zNHjbC9cl4nAwr-Pkp--uzoXQs"
);

const CLAVE_ULTIMO_EMAIL = "vialReportUltimoEmail";
const EXIGIR_EMPRESA_HABILITADA = true;
const PANTALLA_INICIO_KPIS = "visor-partes.html";

const inputEmail = document.getElementById("email");
const inputPassword = document.getElementById("password");
const btnLogin = document.getElementById("btnLogin");
const btnLoginTexto = document.getElementById("btnLoginTexto");
const btnLoginSpinner = document.getElementById("btnLoginSpinner");
const alertaLogin = document.getElementById("alertaLogin");

const guardadoEmail = localStorage.getItem(CLAVE_ULTIMO_EMAIL);
if (guardadoEmail) {
  inputEmail.value = guardadoEmail;
}

function mostrarError(mensaje) {
  alertaLogin.textContent = mensaje;
  alertaLogin.classList.remove("d-none");
}

function ocultarError() {
  alertaLogin.textContent = "";
  alertaLogin.classList.add("d-none");
}

function setCargando(cargando) {
  btnLogin.disabled = cargando;
  inputEmail.disabled = cargando;
  inputPassword.disabled = cargando;
  btnLoginTexto.textContent = cargando ? "Ingresando..." : "Ingresar";
  btnLoginSpinner.classList.toggle("d-none", !cargando);
}

function traducirErrorAuth(errMsg) {
  const msg = String(errMsg || "").toLowerCase();
  if (msg.includes("invalid login credentials")) {
    return "Correo o contraseña incorrectos.";
  }
  if (msg.includes("email not confirmed")) {
    return "El correo aún no fue confirmado.";
  }
  if (msg.includes("too many requests")) {
    return "Demasiados intentos. Esperá unos minutos y volvé a intentarlo.";
  }
  return errMsg || "No se pudo iniciar sesión.";
}

document.getElementById("btnTogglePass").addEventListener("click", () => {
  const esPassword = inputPassword.type === "password";
  inputPassword.type = esPassword ? "text" : "password";
  document.getElementById("iconoPass").className = esPassword ? "bi bi-eye-slash" : "bi bi-eye";
});

async function intentarLogin() {
  ocultarError();

  const email = inputEmail.value.trim();
  const password = inputPassword.value;

  if (!email || !password) {
    mostrarError("Completá el correo electrónico y la contraseña.");
    return;
  }

  setCargando(true);

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      mostrarError(traducirErrorAuth(error.message));
      setCargando(false);
      return;
    }

    if (EXIGIR_EMPRESA_HABILITADA && data?.user?.id) {
      const { data: empRows, error: empError } = await supabaseClient
        .from("empresas")
        .select("user_id")
        .eq("user_id", data.user.id)
        .limit(1);

      if (empError || !empRows || empRows.length === 0) {
        await supabaseClient.auth.signOut();
        mostrarError("Tu usuario aún no tiene una empresa habilitada. Consultá con el administrador.");
        setCargando(false);
        return;
      }
    }

    localStorage.setItem(CLAVE_ULTIMO_EMAIL, email);
    window.location.href = PANTALLA_INICIO_KPIS;
  } catch (e) {
    mostrarError("Ocurrió un error de conexión al intentar ingresar.");
    setCargando(false);
  }
}

btnLogin.addEventListener("click", intentarLogin);

[inputEmail, inputPassword].forEach((el) => {
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      intentarLogin();
    }
  });
});
</script>

<footer>
  © <span id="year"></span> - VIAL REPORT
  <br>
  Powered by <b>SMG DESARROLLOS</b>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
