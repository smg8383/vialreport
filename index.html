<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Informe Fotográfico</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
/* Cards de tareas */
.card.grupo {
  transition: transform 0.2s, box-shadow 0.2s;
}
.card.grupo:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

/* Previews de imágenes */
.preview img{
  height:120px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ccc;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  transition: transform 0.2s;
}
.preview img:hover {
  transform: scale(1.05);
}
/* Efecto dragover */
.paste-zone {
  min-height: 150px;
  width: 100%;
  position: relative;
  z-index: 999;
  pointer-events: all;
  border: 2px dashed #ccc;
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  transition: 0.2s;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #666;
}

.paste-zone:hover {
  background: #f1f1f1;
}

.paste-zone.dragover {
  background: #d0ebff;
  border-color: #0d6efd;
  color: #0d6efd;
  transform: scale(1.02);
  box-shadow: 0 0 10px rgba(13,110,253,0.3);
}
  
/* Footer minimalista */
footer {
  backdrop-filter: blur(5px);
  background: rgba(255,255,255,0.9);
  font-size: 13px;
  padding: 6px;
  border-top: 1px solid #ddd;
}

/* Navbar logo y estilo */
.navbar-brand img {
  height:80px;
  margin-right:10px;
}
</style>

<!-- Configuración PWA / Pantalla completa iOS -->

</head>

<body class="bg-light p-4">

<!-- Navbar con logo y Cerrar Sesión -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="https://res.cloudinary.com/ddgc2azm8/image/upload/v1775232056/logo2_fnyfpq.png" alt="Logo">
      <div class="ms-2">
        <span class="fw-bold text-primary fs-5">VIAL REPORT</span>
        <br>
        <span class="text-muted fs-6">Informes Fotográfico</span>

<!-- Título principal -->
<div class="container mb-4 text-center">
  <h1 class="text-primary">Generar Informe Fotográfico</h1>
</div>

<div class="container">
  
  <a href="visor.html" class="btn btn-info mb-3">
    <i class="bi bi-folder2-open"></i> Ver registros
  </a>

  <form id="form">
    <input type="hidden" id="total_groups" value="1">

    <div id="grupos">
      <div class="card shadow-sm mb-4 grupo">
        <div class="card-header bg-secondary text-white">
          <h5 class="mb-0">Tarea 1</h5>
        </div>
        <div class="card-body">
          <div class="row g-3">

            <div class="col-md-4">
              <label>Fecha</label>
              <input type="date" name="date_1" class="form-control form-control-lg" required>
            </div>

            <div class="col-md-4">
              <label>Empresa</label>
              <select name="empresa_1" class="form-select form-select-lg">
                <option value="JCR SA" selected>JCR SA</option>
                <option value="GUERECHET SA">GUERECHET SA</option>
                <option value="VIAL PLUS SA">VIAL PLUS SA</option>
              </select>
            </div>

            <div class="col-md-4">
              <label>Ruta</label>
              <select name="ruta_1" class="form-select form-select-lg">
                <option value="RN N° 16" selected>RN N° 16</option>
                <option value="RN N° 12">RN N° 12</option>
              </select>
            </div>

            <div class="col-md-4">
              <label>Subtramo</label>
              <select name="subtramo_1" class="form-select form-select-lg">
                <option value="CHACO" selected>CHACO</option>
                <option value="CORRIENTES (NORTE)">CORRIENTES (NORTE)</option>
                <option value="CORRIENTES (SUR)">CORRIENTES (SUR)</option>
                <option value="MISIONES">MISIONES</option>
              </select>
            </div>

            <div class="col-md-4">
              <label>Subtarea</label>
              <select name="tarea_1" class="form-select form-select-lg tarea-select"></select>
            </div>
            
            <div class="col-md-4">
              <label>Km</label>
              <input type="text" name="km_1" class="form-control form-control-lg" placeholder="Ingrese km">
            </div>

            <div class="col-md-4">
              <label>Sentido</label>
              <select name="sentido_1" class="form-select form-select-lg">
                <option value="ASCENDENTE" selected>ASCENDENTE</option>
                <option value="DESCENDENTE">DESCENDENTE</option>
                <option value="ASCENDENTE/DESCENDENTE">ASCENDENTE/DESCENDENTE</option>
              </select>
            </div>

            <div class="col-md-12">
              <label>Observación</label>
              <input type="text" name="observacion_1" class="form-control form-control-lg" placeholder="Ingrese observación">
            </div>

            <!-- SECCIÓN DE FOTOS UNIFICADA -->
            <div class="col-md-12">
              <label>Fotos (máx 4)</label>
              
              <div class="row g-2 mb-2">
                <!-- Botón 1: Galería / Múltiples archivos -->
                <div class="col-6">
                  <label class="btn btn-outline-primary w-100 mb-0 py-2" style="cursor: pointer;">
                    <i class="bi bi-image"></i> Galería
                    <input type="file" name="photos_1" class="form-control fotos d-none" multiple accept="image/*">
                  </label>
                </div>

                <!-- Botón 2: Cámara directa que inyecta directo al input principal "fotos" -->
                <div class="col-6">
                  <label class="btn btn-dark w-100 mb-0 py-2 text-white" style="cursor: pointer;">
                    <i class="bi bi-camera-fill"></i> Cámara
                    <input type="file" class="camara-directa d-none" accept="image/*" capture="environment" onchange="agregarFotoCamara(this)">
                  </label>
                </div>
              </div>

              <div class="paste-zone border rounded p-3 text-center text-muted mt-2" tabindex="0">
                📷 Pegá imágenes здесь (Ctrl+V) o arrastralas
              </div>
            </div>

            <div class="progress mt-2">
              <div class="progress-bar" style="width:0%"></div>
            </div>

            <div class="row preview mt-2"></div>
            <div class="row mt-2" id="imagenesActuales"></div>

          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between mt-4 mb-5">
      <button type="button" id="addGroup" class="btn btn-outline-primary">
        <i class="bi bi-plus-circle"></i> Agregar tarea
      </button>
      <button type="button" id="clearForm" class="btn btn-outline-danger">
        <i class="bi bi-x-circle"></i> Limpiar
      </button>
      <button type="submit" class="btn btn-success">
        <i class="bi bi-save"></i> Guardar
      </button>
    </div>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js" defer></script>

<script>
let pegando = false;

// =============================
// 📷 PREVIEW DE IMÁGENES
// =============================
function actualizarPreview(input){
  const files = Array.from(input.files);

  if (files.length > 4) {
    alert("Máximo 4 imágenes");
    input.value = "";
    return;
  }

  const preview = input.closest(".grupo").querySelector(".preview");
  preview.innerHTML = "";

  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      preview.innerHTML += `
        <div class="col-md-3 mb-2">
          <img src="${ev.target.result}" class="img-fluid rounded border">
        </div>`;
    };
    reader.readAsDataURL(file);
  });
}

// =============================
// 📸 CAPTURA DIRECTA DE CÁMARA (UNIFICADA)
// =============================
function agregarFotoCamara(inputCamara) {
  if (inputCamara.files.length === 0) return;

  const grupo = inputCamara.closest(".grupo");
  const inputPrincipal = grupo.querySelector(".fotos");

  const dt = new DataTransfer();
  // Mantener las fotos que ya estaban seleccionadas
  Array.from(inputPrincipal.files || []).forEach(f => dt.items.add(f));
  // Agregar la nueva foto sacada con la cámara
  Array.from(inputCamara.files).forEach(f => dt.items.add(f));

  if (dt.files.length > 4) {
    alert("Máximo 4 imágenes en total por tarea.");
    inputCamara.value = "";
    return;
  }

  inputPrincipal.files = dt.files;
  actualizarPreview(inputPrincipal);
  inputCamara.value = ""; // Limpiar para permitir sacar otra foto si se desea
}

// Escuchar cambios tradicionales de la galería
document.addEventListener("change", (e) => {
  if (e.target.classList.contains("fotos")) {
    actualizarPreview(e.target);
  }
});

// =============================
// 🖱️ DRAG & DROP GLOBAL
// =============================
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => e.preventDefault());

// =============================
// 🎯 DRAG SOBRE ZONA
// =============================
document.addEventListener("dragenter", (e) => {
  const zona = e.target.closest(".paste-zone");
  if (zona) {
    zona.classList.add("dragover");
    zona.textContent = "Soltá la imagen acá 📥";
  }
});

document.addEventListener("dragleave", (e) => {
  const zona = e.target.closest(".paste-zone");
  if (zona) {
    zona.classList.remove("dragover");
    zona.textContent = "📷 Pegá imágenes aquí (Ctrl+V) o arrastralas";
  }
});

// =============================
// 📥 DROP DE IMÁGENES
// =============================
document.addEventListener("drop", (e) => {
  const zona = e.target.closest(".paste-zone");
  if (!zona) return;

  zona.classList.remove("dragover");
  zona.textContent = "📷 Pegá imágenes aquí (Ctrl+V) o arrastralas";

  const grupo = zona.closest(".grupo");
  const input = grupo.querySelector(".fotos");

  const dt = new DataTransfer();
  Array.from(input.files || []).forEach(f => dt.items.add(f));

  const files = e.dataTransfer.files;

  for (let i = 0; i < files.length; i++) {
    if (files[i].type.startsWith("image/")) {
      dt.items.add(files[i]);
    }
  }

  if (dt.files.length > 4) {
    alert("Máximo 4 imágenes");
    return;
  }

  input.files = dt.files;
  actualizarPreview(input);
});

// =============================
// 🖱️ CLICK EN ZONA
// =============================
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("paste-zone")) {
    const zona = e.target;

    zona.textContent = "📋 Ahora presioná CTRL + V para pegar";
    zona.focus();

    setTimeout(() => {
      zona.textContent = "📷 Pegá imágenes aquí (Ctrl+V) o arrastralas";
    }, 2000);
  }
});

// =============================
// 📋 PEGAR EN ZONA CON CTRL + V
// =============================
document.addEventListener("paste", (e) => {
  if (pegando) return;
  pegando = true;
  setTimeout(() => pegando = false, 100);

  const zona = document.activeElement;
  if (!zona || !zona.classList.contains("paste-zone")) return;

  e.preventDefault();

  const grupo = zona.closest(".grupo");
  const input = grupo.querySelector(".fotos");

  const dt = new DataTransfer();
  Array.from(input.files || []).forEach(f => dt.items.add(f));

  const items = e.clipboardData.items;

  for (let i = 0; i < items.length; i++) {
    if (items[i].type.startsWith("image/")) {
      const file = items[i].getAsFile();
      dt.items.add(file);
    }
  }

  input.files = dt.files;
  actualizarPreview(input);
});
</script>
