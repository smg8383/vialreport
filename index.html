<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Informe Fotográfico</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
/* Cards de tareas */
.card.grupo {
  transition: transform 0.2s, box-shadow 0.2s;
}
.card.grupo:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

/* Contenedor del Mapa - Altura fija obligatoria */
.mapa-tarea {
  height: 260px !important;
  width: 100% !important;
  border-radius: 8px;
  border: 1px solid #ced4da;
  z-index: 1;
}

/* Previews de imágenes */
.preview img{
  height:120px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ccc;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  transition: transform 0.2s;
}
.preview img:hover {
  transform: scale(1.05);
}

/* Efecto dragover */
.paste-zone {
  min-height: 150px;
  width: 100%;
  position: relative;
  z-index: 10;
  border: 2px dashed #ccc;
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  transition: 0.2s;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #666;
}

.paste-zone:hover {
  background: #f1f1f1;
}

.paste-zone.dragover {
  background: #d0ebff;
  border-color: #0d6efd;
  color: #0d6efd;
  transform: scale(1.02);
  box-shadow: 0 0 10px rgba(13,110,253,0.3);
}
  
/* Footer minimalista */
footer {
  backdrop-filter: blur(5px);
  background: rgba(255,255,255,0.9);
  font-size: 13px;
  padding: 6px;
  border-top: 1px solid #ddd;
}

/* Navbar logo y estilo */
.navbar-brand img {
  height:80px;
  margin-right:10px;
}
</style>

<!-- Configuración PWA / Pantalla completa iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body class="bg-light p-4">

      <img src="https://res.cloudinary.com/ddgc2azm8/image/upload/v1775232056/logo2_fnyfpq.png" alt="Logo">
      <div class="ms-2">
        <span class="fw-bold text-primary fs-5">VIAL REPORT</span>
        <br>
        <span class="text-muted fs-6">Informes Fotográfico</span>
      </div>
    </a>

<!-- Título principal -->
<div class="container mb-4 text-center">
  <h1 class="text-primary">Generar Informe Fotográfico</h1>
</div>

<div class="container">
  
  <a href="visor.html" class="btn btn-info mb-3">
    <i class="bi bi-folder2-open"></i> Ver registros
  </a>

  <form id="form">
    <input type="hidden" id="total_groups" value="1">

    <div id="grupos">
      <div class="card shadow-sm mb-4 grupo" data-grupo-id="1">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Tarea 1</h5>
        </div>
        <div class="card-body">
          <div class="row g-3">

            <div class="col-md-4">
              <label>Fecha</label>
              <input type="date" name="date_1" class="form-control form-control-lg" required>
            </div>

            <div class="col-md-4">
              <label>Empresa</label>
              <select name="empresa_1" class="form-select form-select-lg">
                <option value="JCR SA" selected>JCR SA</option>
                <option value="GUERECHET SA">GUERECHET SA</option>
                <option value="VIAL PLUS SA">VIAL PLUS SA</option>
                <option value="CORREDOR LITORAL SA">CORREDOR LITORAL SA</option>
              </select>
            </div>

            <div class="col-md-4">
              <label>Ruta</label>
              <select name="ruta_1" class="form-select form-select-lg">
                <option value="RN N° 16" selected>RN N° 16</option>
                <option value="RN N° 12">RN N° 12</option>
              </select>
            </div>

            <div class="col-md-4">
              <label>Subtramo</label>
              <select name="subtramo_1" class="form-select form-select-lg">
                <option value="CHACO" selected>CHACO</option>
                <option value="CORRIENTES (NORTE)">CORRIENTES (NORTE)</option>
                <option value="CORRIENTES (SUR)">CORRIENTES (SUR)</option>
              </select>
            </div>

            <div class="col-md-4">
              <label>Subtarea</label>
              <select name="tarea_1" class="form-select form-select-lg tarea-select"></select>
            </div>
            
            <div class="col-md-4">
              <label>Km</label>
              <input type="text" name="km_1" class="form-control form-control-lg" placeholder="Ingrese km o use el GPS">
            </div>

            <div class="col-md-4">
              <label>Sentido</label>
              <select name="sentido_1" class="form-select form-select-lg">
                <option value="ASCENDENTE" selected>ASCENDENTE</option>
                <option value="DESCENDENTE">DESCENDENTE</option>
                <option value="ASCENDENTE/DESCENDENTE">ASCENDENTE/DESCENDENTE</option>
              </select>
            </div>

            <div class="col-md-8">
              <label>Observación</label>
              <input type="text" name="observacion_1" class="form-control form-control-lg" placeholder="Ingrese observación">
            </div>

            <!-- SECCIÓN DE FOTOS UNIFICADA -->
            <div class="col-md-12">
              <label>Fotos (máx 4)</label>
              
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <label class="btn btn-outline-primary w-100 mb-0 py-2" style="cursor: pointer;">
                    <i class="bi bi-image"></i> Galería
                    <input type="file" name="photos_1" class="form-control fotos d-none" multiple accept="image/*">
                  </label>
                </div>

                <div class="col-6">
                  <label class="btn btn-dark w-100 mb-0 py-2 text-white" style="cursor: pointer;">
                    <i class="bi bi-camera-fill"></i> Cámara
                    <input type="file" class="camara-directa d-none" accept="image/*" capture="environment" onchange="agregarFotoCamara(this)">
                  </label>
                </div>
              </div>

              <div class="paste-zone border rounded p-3 text-center text-muted mt-2" tabindex="0">
                📷 Pegá imágenes aquí (Ctrl+V) o arrastralas
              </div>
            </div>

            <div class="progress mt-2">
              <div class="progress-bar" style="width:0%"></div>
            </div>

            <div class="row preview mt-2"></div>
            <div class="row mt-2" id="imagenesActuales"></div>

            <!-- 🗺️ MAPA Y GPS EN LA PARTE INFERIOR DE LA TAREA -->
            <div class="col-md-12 mt-4 pt-3 border-top">
              <label class="fw-bold text-primary mb-2"><i class="bi bi-geo-alt-fill"></i> Mapa de Referencia y Geolocalización GPS</label>
              <div class="mb-2">
                <button type="button" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" onclick="activarUbicacionGPS(this)">
                  <i class="bi bi-crosshair"></i> Activar mi GPS y autocompletar Km
                </button>
              </div>
              <div id="map_1" class="mapa-tarea mt-2"></div>
              <input type="hidden" name="lat_1" id="lat_1">

      </button>

        <i class="bi bi-save"></i> Guardar
      </button>

<!-- Supabase y Leaflet JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Tu app.js donde vive la lógica central y las credenciales -->
<script src="app.js"></script>

<script>
// =============================
// 🗺️ LÓGICA DE MAPAS Y GPS (Conecta con window.supabaseClient de app.js)
// =============================
const mapasInstanciados = {};
const marcadoresUsuario = {};

async function inicializarMapa(grupoId) {
  const mapElementId = `map_${grupoId}`;
  const el = document.getElementById(mapElementId);
  if (!el || mapasInstanciados[grupoId]) return;

  const map = L.map(mapElementId).setView([-27.4692, -58.8341], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  mapasInstanciados[grupoId] = map;

  setTimeout(() => { map.invalidateSize(); }, 300);

  try {
    // Validar que app.js ya haya cargado y asignado supabaseClient al ámbito global
    if (typeof window.supabaseClient === 'undefined') {
      setTimeout(() => inicializarMapa(grupoId), 500);
      return;
    }

    const { data, error } = await window.supabaseClient
      .from('progresivas_viales')
      .select('id, ruta, progresiva, distrito, latitud, longitud');

    if (!error && data) {
      data.forEach(punto => {
        if (punto.latitud && punto.longitud) {
          let colorCirculo = (punto.ruta && punto.ruta.includes('12')) ? '#1F4E78' : '#28a745';

          let circleMarker = L.circleMarker([punto.latitud, punto.longitud], {
            radius: 5,
            fillColor: colorCirculo,
            color: '#fff',
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          }).addTo(map);

          circleMarker.bindPopup(`<b>Ruta:</b> ${punto.ruta}<br><b>Progresiva:</b> Km ${punto.progresiva}<br><b>Distrito:</b> ${punto.distrito || 'N/D'}`);
        }
      });
    }
  } catch (err) {
    console.error("Error cargando progresivas:", err);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => { inicializarMapa(1); }, 400);
});

// Interceptar "Agregar tarea" para inicializar el mapa de las nuevas tarjetas
document.getElementById("addGroup").addEventListener("click", () => {
  setTimeout(() => {
    const totalGroups = document.querySelectorAll(".grupo").length;
    const ultimaTarjeta = document.querySelectorAll(".grupo")[totalGroups - 1];
    ultimaTarjeta.setAttribute("data-grupo-id", totalGroups);
    
    const mapaDiv = ultimaTarjeta.querySelector(".mapa-tarea");
    mapaDiv.id = `map_${totalGroups}`;
    
    inicializarMapa(totalGroups);
  }, 300);
});

// =============================
// 📍 ACTIVAR GPS Y CALCULAR PROGRESIVA
// =============================
async function activarUbicacionGPS(btn) {
  const cardGrupo = btn.closest(".grupo");
  const grupoId = cardGrupo.getAttribute("data-grupo-id");
  const inputKm = cardGrupo.querySelector(`[name^="km_"]`);
  const inputLat = cardGrupo.querySelector(`[id^="lat_"]`);
  const inputLon = cardGrupo.querySelector(`[id^="lon_"]`);
  const map = mapasInstanciados[grupoId];

  if (!navigator.geolocation) {
    alert("Tu dispositivo no soporta geolocalización.");
    return;
  }

  btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Obteniendo GPS...`;
  btn.disabled = true;

  navigator.geolocation.getCurrentPosition(async (position) => {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const accuracy = position.coords.accuracy;

    if (inputLat) inputLat.value = lat;
    if (inputLon) inputLon.value = lon;

    if (map) {
      map.invalidateSize();
      map.setView([lat, lon], 15);
      if (marcadoresUsuario[grupoId]) {
        map.removeLayer(marcadoresUsuario[grupoId].marker);
        map.removeLayer(marcadoresUsuario[grupoId].circle);
      }

      const userMarker = L.marker([lat, lon]).addTo(map).bindPopup("📍 Tu posición actual").openPopup();
      const accuracyCircle = L.circle([lat, lon], { radius: accuracy, color: '#dc3545', fillColor: '#f03', fillOpacity: 0.2 }).addTo(map);
      
      marcadoresUsuario[grupoId] = { marker: userMarker, circle: accuracyCircle };
    }

    try {
      if (typeof window.supabaseClient === 'undefined') {
        alert("Error: cliente de Supabase no disponible.");
        return;
      }

      const { data, error } = await window.supabaseClient.rpc('fn_obtener_progresiva_cercana', {
        p_longitud: lon,
        p_latitud: lat,
        p_radio_metros: 5000 // Radio de búsqueda de 5 km
      });

      if (error) {
        console.error("Error en RPC Supabase:", error);
        alert("Error al calcular la progresiva en la base de datos.");
      } else if (data && data.length > 0) {
        if (inputKm) inputKm.value = data[0].progresiva;
        alert(`¡Ubicación detectada! Km más cercano: ${data[0].progresiva} (${data[0].ruta})`);
      } else {
        alert("Estás a más de 5 km de una progresiva registrada.");
      }
    } catch (err) {
      console.error("Excepción:", err);
      alert("Error de conexión al consultar Supabase.");
    } finally {
      btn.innerHTML = `<i class="bi bi-crosshair"></i> Activar mi GPS y autocompletar Km`;
      btn.disabled = false;
    }

  }, (error) => {
    btn.innerHTML = `<i class="bi bi-crosshair"></i> Activar mi GPS y autocompletar Km`;
    btn.disabled = false;
    alert("No se pudo obtener la ubicación GPS. Verifica los permisos en los ajustes de tu celular.");
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

// =============================
// 📷 CAPTURA DE CÁMARA DIRECTA
// =============================
function agregarFotoCamara(inputCamara) {
  if (inputCamara.files.length === 0) return;

  const grupo = inputCamara.closest(".grupo");
  const inputPrincipal = grupo.querySelector(".fotos");

  const dt = new DataTransfer();
  Array.from(inputPrincipal.files || []).forEach(f => dt.items.add(f));
  Array.from(inputCamara.files).forEach(f => dt.items.add(f));

  if (dt.files.length > 4) {
    alert("Máximo 4 imágenes en total por tarea.");
    inputCamara.value = "";
    return;
  }

  inputPrincipal.files = dt.files;
  
  const event = new Event('change', { bubbles: true });
  inputPrincipal.dispatchEvent(event);
  inputCamara.value = "";
}
</script>
