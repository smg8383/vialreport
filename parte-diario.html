);

const CLOUD_NAME = "ddgc2azm8";
const UPLOAD_PRESET = "unsigned_upload";
const STORAGE_KEY_UNIDADES = "vial_report_unidades_parte_diario";

const UNIDADES_BASE = ["km", "m", "m²", "m³", "tn", "un", "hs", "%"];

let usuarioActual = null;
let organizacionUsuario = null;
let coordsActuales = { latitud: null, longitud: null };
let fotosSeleccionadas = [];
let tareasCache = [];

function obtenerFechaHoyLocal() {
  const hoy = new Date();
  const año = hoy.getFullYear();
  const mes = String(hoy.getMonth() + 1).padStart(2, "0");
  const dia = String(hoy.getDate()).padStart(2, "0");
  return `${año}-${mes}-${dia}`;
}

function mostrarAlerta(tipo, mensaje) {
  const el = document.getElementById("alertaForm");
  el.className = `alert alert-${tipo} py-2 px-3 small`;
  el.textContent = mensaje;
  el.classList.remove("d-none");
}

function obtenerUnidadesGuardadas() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_UNIDADES);
    const extras = raw ? JSON.parse(raw) : [];
    const lista = Array.isArray(extras) ? extras : [];
    return Array.from(new Set([...UNIDADES_BASE, ...lista.map(u => String(u).trim()).filter(Boolean)]));
  } catch (e) {
    return [...UNIDADES_BASE];
  }
}

function cargarUnidades(seleccionarValor = null) {
  const selectUnidad = document.getElementById("avance_unidad");
  const valorActual = seleccionarValor || selectUnidad.value;
  const unidades = obtenerUnidadesGuardadas();

  selectUnidad.innerHTML = `<option value="">Seleccionar...</option>`;
  unidades.forEach((u) => {
    const opt = document.createElement("option");
    opt.value = u;
    opt.textContent = u;
    selectUnidad.appendChild(opt);
  });

  if (valorActual && unidades.includes(valorActual)) {
    selectUnidad.value = valorActual;
  }
}

document.getElementById("btnGuardarNuevaUnidad").addEventListener("click", () => {
  const inputUnidad = document.getElementById("nuevaUnidadNombre");
  const nuevaUnidad = (inputUnidad?.value || "").trim();

  if (!nuevaUnidad) {
    alert("Ingresá el nombre o símbolo de la unidad.");
    return;
  }

  const actuales = obtenerUnidadesGuardadas();
  const yaExiste = actuales.find(u => u.toLowerCase() === nuevaUnidad.toLowerCase());
  const valorFinal = yaExiste || nuevaUnidad;

  if (!yaExiste) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_UNIDADES);
      const extras = raw ? JSON.parse(raw) : [];
      const lista = Array.isArray(extras) ? extras : [];
      lista.push(nuevaUnidad);
      localStorage.setItem(STORAGE_KEY_UNIDADES, JSON.stringify(Array.from(new Set(lista))));
    } catch (e) {
      console.warn("No se pudo guardar la unidad en localStorage:", e);
    }
  }

  cargarUnidades(valorFinal);
  document.getElementById("avance_unidad").value = valorFinal;
  inputUnidad.value = "";

  const modalEl = document.getElementById("modalNuevaUnidad");
  const modalInstancia = bootstrap.Modal.getInstance(modalEl);
  if (modalInstancia) modalInstancia.hide();
});

function llenarSelectsTareas(data) {
  document.querySelectorAll(".tarea-select").forEach((select) => {
    select.innerHTML = `<option value="">Seleccionar...</option>`;

    let currentTarea = "";
    let currentOptGroup = null;

    data.forEach((item) => {
      if (!item?.tarea || !item?.subtarea) return;

      if (item.tarea !== currentTarea) {
        currentTarea = item.tarea;
        currentOptGroup = document.createElement("optgroup");
        currentOptGroup.label = currentTarea;
        select.appendChild(currentOptGroup);
      }

      const option = document.createElement("option");
      option.value = item.subtarea.toUpperCase();
      option.textContent = item.subtarea.toUpperCase();
      currentOptGroup.appendChild(option);
    });
  });
}

async function cargarTareasJerarquicas(forceRefresh = false) {
  if (!forceRefresh && tareasCache.length > 0) {
    llenarSelectsTareas(tareasCache);
    return tareasCache;
  }

  const { data, error } = await supabaseClient
    .from("tareas")
    .select("*")
    .order("tarea", { ascending: true })
    .order("subtarea", { ascending: true });

  if (error) {
    console.error("Error cargando tareas:", error);
    return [];
  }

  tareasCache = data || [];
  llenarSelectsTareas(tareasCache);
  return tareasCache;
}

document.getElementById("btnGuardarNuevaTarea").addEventListener("click", async () => {
  const inputTarea = document.getElementById("nuevaTareaNombre");
  const inputSubtarea = document.getElementById("nuevaSubtareaNombre");
  const btn = document.getElementById("btnGuardarNuevaTarea");

  const tarea = (inputTarea?.value || "").trim();
  const subtarea = (inputSubtarea?.value || "").trim();

  if (!tarea || !subtarea) {
    alert("Completá tanto la tarea principal como la subtarea.");
    return;
  }

  const textoOriginal = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Guardando...`;

  try {
    const { error } = await supabaseClient
      .from("tareas")
      .insert([{ tarea, subtarea }]);

    if (error) {
      console.error("Error al guardar nueva tarea:", error);
      alert("No se pudo guardar la tarea en Supabase: " + error.message);
      return;
    }

    await cargarTareasJerarquicas(true);

    const valorSeleccionado = subtarea.toUpperCase();
    document.querySelectorAll(".tarea-select").forEach((select) => {
      select.value = valorSeleccionado;
    });

    if (inputTarea) inputTarea.value = "";
    if (inputSubtarea) inputSubtarea.value = "";

    const modalEl = document.getElementById("modalNuevaTarea");
    const modalInstancia = bootstrap.Modal.getInstance(modalEl);
    if (modalInstancia) modalInstancia.hide();
  } catch (err) {
    console.error("Error inesperado al agregar tarea:", err);
    alert("Ocurrió un error al guardar la tarea.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = textoOriginal;
  }
});

function renderPreviews() {
  const contenedor = document.getElementById("previewFotos");
  const contador = document.getElementById("contadorFotos");
  contenedor.innerHTML = "";

  contador.textContent = `${fotosSeleccionadas.length} ${fotosSeleccionadas.length === 1 ? "foto seleccionada" : "fotos seleccionadas"}`;

  fotosSeleccionadas.forEach((file, idx) => {
    const url = URL.createObjectURL(file);
    contenedor.innerHTML += `
      <div class="col-4 col-md-3">
        <div class="preview-card">
          <img src="${url}" class="preview-img" alt="Vista previa ${idx + 1}">
          <button
            type="button"
            class="btn btn-danger btn-quitar-foto"
            onclick="quitarFoto(${idx})"
            title="Quitar foto"
          >
            <i class="bi bi-x"></i>
          </button>
        </div>
      </div>
    `;
  });
}

function agregarFotos(archivosNuevos) {
  const validos = Array.from(archivosNuevos || []).filter(f => f && f.type && f.type.startsWith("image/"));
  if (validos.length === 0) return;
  fotosSeleccionadas = [...fotosSeleccionadas, ...validos];
  renderPreviews();
}

function quitarFoto(index) {
  fotosSeleccionadas.splice(index, 1);
  renderPreviews();
}

function limpiarFotos() {
  fotosSeleccionadas = [];
  document.getElementById("inputCamara").value = "";
  document.getElementById("inputAdjuntar").value = "";
  renderPreviews();
}

async function comprimirImagen(file, maxAncho = 1600, calidad = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const urlTemporal = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(urlTemporal);

      let ancho = img.naturalWidth || img.width;
      let alto = img.naturalHeight || img.height;

      if (ancho > maxAncho) {
        alto = Math.round((alto * maxAncho) / ancho);
        ancho = maxAncho;
      }

      const canvas = document.createElement("canvas");
      canvas.width = ancho;
      canvas.height = alto;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, ancho, alto);

      canvas.toBlob(
        (blob) => {
          resolve(blob ? new File([blob], file.name || "foto.jpg", { type: "image/jpeg" }) : file);
        },
        "image/jpeg",
        calidad
      );
    };

    img.onerror = (err) => {
      URL.revokeObjectURL(urlTemporal);
      reject(err);
    };

    img.src = urlTemporal;
  });
}

function subirACloudinary(file) {
  return new Promise((resolve, reject) => {
    const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
    const xhr = new XMLHttpRequest();
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    xhr.open("POST", url);
    xhr.onload = () => {
      try {
        const res = JSON.parse(xhr.responseText);
        if (res.secure_url) resolve(res.secure_url);
        else reject(new Error("No se obtuvo URL segura de Cloudinary."));
      } catch (err) {
        reject(new Error("Error al procesar respuesta de Cloudinary."));
      }
    };
    xhr.onerror = () => reject(new Error("Error de red al subir imagen a Cloudinary."));
    xhr.send(formData);
  });
}

async function subirFotos(archivos) {
  const urls = [];
  for (let i = 0; i < archivos.length; i++) {
    const comprimida = await comprimirImagen(archivos[i], 1600, 0.82);
    const urlSegura = await subirACloudinary(comprimida);
    urls.push(urlSegura);
  }
  return urls;
}

async function initParteDiario() {
  document.getElementById("fecha").value = obtenerFechaHoyLocal();
  cargarUnidades();

  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) {
    window.location.href = "login.html";
    return;
  }

  usuarioActual = sessionData.session.user;

  const { data: empRows } = await supabaseClient
    .from("empresas")
    .select("nombre")
    .eq("user_id", usuarioActual.id)
    .limit(1);

  organizacionUsuario = empRows && empRows.length > 0 && empRows[0].nombre
    ? String(empRows[0].nombre).trim()
    : null;

  const badge = document.getElementById("badgeOrg");
  if (organizacionUsuario) {
    badge.textContent = organizacionUsuario;
    const selectEmpresa = document.getElementById("empresa");
    const opcionExiste = Array.from(selectEmpresa.options).some(o => o.value === organizacionUsuario);
    if (opcionExiste) selectEmpresa.value = organizacionUsuario;
  } else {
    badge.textContent = "Sin organización asignada";
  }

  await cargarTareasJerarquicas();
}

document.getElementById("btnGPS").addEventListener("click", () => {
  const estado = document.getElementById("estadoGPS");
  if (!navigator.geolocation) {
    estado.textContent = "GPS no soportado";
    return;
  }
  estado.textContent = "Obteniendo GPS...";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      coordsActuales.latitud = pos.coords.latitude;
      coordsActuales.longitud = pos.coords.longitude;
      estado.textContent = `${coordsActuales.latitud.toFixed(5)}, ${coordsActuales.longitud.toFixed(5)}`;
    },
    (err) => {
      estado.textContent = "No se pudo obtener GPS";
      console.warn("Error GPS:", err);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

document.getElementById("inputCamara").addEventListener("change", (e) => {
  agregarFotos(e.target.files);
  e.target.value = "";
});

document.getElementById("inputAdjuntar").addEventListener("change", (e) => {
  agregarFotos(e.target.files);
  e.target.value = "";
});

document.getElementById("formParteDiario").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnGuardar");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Guardando...`;

  try {
    const urlsFotos = fotosSeleccionadas.length > 0 ? await subirFotos(fotosSeleccionadas) : [];
    const avanceVal = document.getElementById("avance_cantidad").value;

    const payload = {
      user_id: usuarioActual.id,
      organizacion_id: organizacionUsuario,
      fecha: document.getElementById("fecha").value,
      empresa: document.getElementById("empresa").value || null,
      ruta: document.getElementById("ruta").value || null,
      subtramo: document.getElementById("subtramo").value || null,
      km: document.getElementById("km").value.trim() || null,
      sentido: document.getElementById("sentido").value || null,
      estado: document.getElementById("estado").value,
      tarea: document.getElementById("tarea").value,
      avance_cantidad: avanceVal !== "" ? Number(avanceVal) : null,
      avance_unidad: document.getElementById("avance_unidad").value || null,
      observacion: document.getElementById("observacion").value.trim() || null,
      latitud: coordsActuales.latitud,
      longitud: coordsActuales.longitud,
      imagenes: urlsFotos
    };

    const { error } = await supabaseClient
      .from("partes_diarios")
      .insert(payload);

    if (error) throw new Error(error.message);

    mostrarAlerta("success", "Parte diario guardado correctamente.");
    document.getElementById("tarea").value = "";
    document.getElementById("avance_cantidad").value = "";
    document.getElementById("avance_unidad").value = "";
    document.getElementById("observacion").value = "";
    limpiarFotos();
    coordsActuales = { latitud: null, longitud: null };
    document.getElementById("estadoGPS").textContent = "Sin coordenadas";
  } catch (err) {
    console.error(err);
    mostrarAlerta("danger", err.message || "No se pudo guardar el parte diario.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<i class="bi bi-check-circle-fill"></i> Guardar Parte Diario`;
  }
});

document.getElementById("btnLogout").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
});

initParteDiario();
</script>
