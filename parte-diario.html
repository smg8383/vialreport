function obtenerFechaHoyLocal() {
  const hoy = new Date();
  const año = hoy.getFullYear();
  const mes = String(hoy.getMonth() + 1).padStart(2, "0");
  const dia = String(hoy.getDate()).padStart(2, "0");
  return `${año}-${mes}-${dia}`;
}

function mostrarAlerta(tipo, mensaje) {
  const el = document.getElementById("alertaForm");
  el.className = `alert alert-${tipo} py-2 px-3 small`;
  el.textContent = mensaje;
  el.classList.remove("d-none");
}

function formatearEtiquetaTarea(fila) {
  if (typeof fila === "string") return fila.trim();
  const tarea = (fila.tarea || fila.nombre || fila.titulo || "").trim();
  const subtarea = (fila.subtarea || fila.rubro || "").trim();
  if (tarea && subtarea) return `${tarea} — ${subtarea}`;
  return tarea || subtarea || "";
}

async function cargarCatalogoTareas(seleccionarValor = null) {
  const selectTarea = document.getElementById("tarea");
  const valorAnterior = seleccionarValor || selectTarea.value;

  const tareasBaseRespaldo = [
    "Corte de pasto y desmalezado",
    "Bacheo asfáltico",
    "Calce de banquinas",
    "Limpieza de alcantarillas y desagües",
    "Señalización horizontal / vertical",
    "Mantenimiento de guarda-rails"
  ];

  let opciones = [];

  try {
    const { data, error } = await supabaseClient
      .from(TABLA_TAREAS)
      .select("*")
      .limit(500);

    if (!error && Array.isArray(data) && data.length > 0) {
      opciones = data
        .map(formatearEtiquetaTarea)
        .filter(Boolean);
    }
  } catch (err) {
    console.warn("No se pudo leer catálogo desde Supabase, usando respaldo:", err);
  }

  const unicas = Array.from(new Set([...opciones, ...tareasBaseRespaldo]));

  selectTarea.innerHTML = `<option value="">Seleccionar tarea...</option>`;
  unicas.forEach((texto) => {
    const opt = document.createElement("option");
    opt.value = texto;
    opt.textContent = texto;
    selectTarea.appendChild(opt);
  });

  if (valorAnterior && Array.from(selectTarea.options).some(o => o.value === valorAnterior)) {
    selectTarea.value = valorAnterior;
  }
}

document.getElementById("btnGuardarNuevaTarea").addEventListener("click", async () => {
  const tareaInput = document.getElementById("nuevaTareaNombre");
  const subtareaInput = document.getElementById("nuevaSubtareaNombre");
  const btn = document.getElementById("btnGuardarNuevaTarea");

  const tareaNombre = tareaInput.value.trim();
  const subtareaNombre = subtareaInput.value.trim();

  if (!tareaNombre && !subtareaNombre) {
    alert("Ingresá al menos el nombre de la tarea.");
    return;
  }

  const etiquetaFinal = tareaNombre && subtareaNombre
    ? `${tareaNombre} — ${subtareaNombre}`
    : (tareaNombre || subtareaNombre);

  btn.disabled = true;

  try {
    // Intenta guardar en la tabla de tareas si existe en Supabase
    const payloadCatalogo = {
      tarea: tareaNombre || subtareaNombre,
      subtarea: subtareaNombre || null
    };
    const { error } = await supabaseClient.from(TABLA_TAREAS).insert(payloadCatalogo);
    if (error) {
      console.warn("No se guardó en catálogo remoto, se agrega al selector local:", error.message);

    console.warn("Error al insertar en catálogo:", e);

    btn.disabled = false;
  }

  await cargarCatalogoTareas(etiquetaFinal);
  document.getElementById("tarea").value = etiquetaFinal;

  tareaInput.value = "";
  subtareaInput.value = "";

  const modalEl = document.getElementById("modalNuevaTarea");
  const modalInst = bootstrap.Modal.getInstance(modalEl);
  if (modalInst) modalInst.hide();
});

function renderPreviews() {
  const contenedor = document.getElementById("previewFotos");
  const contador = document.getElementById("contadorFotos");
  contenedor.innerHTML = "";

  contador.textContent = `${fotosSeleccionadas.length} ${fotosSeleccionadas.length === 1 ? "foto seleccionada" : "fotos seleccionadas"}`;

  fotosSeleccionadas.forEach((file, idx) => {
    const url = URL.createObjectURL(file);
    contenedor.innerHTML += `
      <div class="col-4 col-md-3">
        <div class="preview-card">
          <img src="${url}" class="preview-img" alt="Vista previa ${idx + 1}">
          <button
            type="button"
            class="btn btn-danger btn-quitar-foto"
            onclick="quitarFoto(${idx})"
            title="Quitar foto"
          >
            <i class="bi bi-x"></i>
          </button>
        </div>
      </div>
    `;
  });
}

function agregarFotos(archivosNuevos) {
  const validos = Array.from(archivosNuevos || []).filter(f => f && f.type && f.type.startsWith("image/"));
  if (validos.length === 0) return;
  fotosSeleccionadas = [...fotosSeleccionadas, ...validos];
  renderPreviews();
}

function quitarFoto(index) {
  fotosSeleccionadas.splice(index, 1);
  renderPreviews();
}

function limpiarFotos() {
  fotosSeleccionadas = [];
  document.getElementById("inputCamara").value = "";
  document.getElementById("inputAdjuntar").value = "";
  renderPreviews();
}

async function comprimirImagen(file, maxAncho = 1600, calidad = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const urlTemporal = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(urlTemporal);

      let ancho = img.naturalWidth || img.width;
      let alto = img.naturalHeight || img.height;

      if (ancho > maxAncho) {
        alto = Math.round((alto * maxAncho) / ancho);
        ancho = maxAncho;
      }

      const canvas = document.createElement("canvas");
      canvas.width = ancho;
      canvas.height = alto;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, ancho, alto);

      canvas.toBlob(
        (blob) => {
          resolve(blob || file);
        },
        "image/jpeg",
        calidad
      );
    };

    img.onerror = (err) => {
      URL.revokeObjectURL(urlTemporal);
      reject(err);
    };

    img.src = urlTemporal;
  });
}

async function initParteDiario() {
  document.getElementById("fecha").value = obtenerFechaHoyLocal();

  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) {
    window.location.href = "login.html";
    return;
  }

  usuarioActual = sessionData.session.user;

  const { data: empRows } = await supabaseClient
    .from("empresas")
    .select("nombre")
    .eq("user_id", usuarioActual.id)
    .limit(1);

  organizacionUsuario = empRows && empRows.length > 0 && empRows[0].nombre
    ? String(empRows[0].nombre).trim()
    : null;

  const badge = document.getElementById("badgeOrg");
  if (organizacionUsuario) {
    badge.textContent = organizacionUsuario;
    const selectEmpresa = document.getElementById("empresa");
    const opcionExiste = Array.from(selectEmpresa.options).some(o => o.value === organizacionUsuario);
    if (opcionExiste) selectEmpresa.value = organizacionUsuario;
  } else {
    badge.textContent = "Sin organización asignada";
  }

  await cargarCatalogoTareas();
}

document.getElementById("btnGPS").addEventListener("click", () => {
  const estado = document.getElementById("estadoGPS");
  if (!navigator.geolocation) {
    estado.textContent = "GPS no soportado";
    return;
  }
  estado.textContent = "Obteniendo GPS...";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      coordsActuales.latitud = pos.coords.latitude;
      coordsActuales.longitud = pos.coords.longitude;
      estado.textContent = `${coordsActuales.latitud.toFixed(5)}, ${coordsActuales.longitud.toFixed(5)}`;
    },
    (err) => {
      estado.textContent = "No se pudo obtener GPS";
      console.warn("Error GPS:", err);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

async function subirFotos(archivos) {
  const urls = [];
  for (let i = 0; i < archivos.length; i++) {
    const archivo = archivos[i];
    const blobComprimido = await comprimirImagen(archivo, 1600, 0.82);
    const rutaArchivo = `partes/${usuarioActual.id}/${Date.now()}_${i}.jpg`;

    const { error } = await supabaseClient.storage
      .from(STORAGE_BUCKET)
      .upload(rutaArchivo, blobComprimido, {
        contentType: "image/jpeg",
        upsert: false
      });

    if (error) {
      throw new Error(`Error al subir foto "${archivo.name}": ${error.message}`);
    }

    const { data: pub } = supabaseClient.storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(rutaArchivo);

    if (pub && pub.publicUrl) urls.push(pub.publicUrl);
  }
  return urls;
}

      latitud: coordsActuales.latitud,
      longitud: coordsActuales.longitud,
      imagenes: urlsFotos
    };

    const { error } = await supabaseClient
      .from("partes_diarios")
      .insert(payload);

    if (error) throw new Error(error.message);

    mostrarAlerta("success", "Parte diario guardado correctamente.");
    document.getElementById("tarea").value = "";
    document.getElementById("avance_cantidad").value = "";
    document.getElementById("observacion").value = "";
    limpiarFotos();
    coordsActuales = { latitud: null, longitud: null };
    document.getElementById("estadoGPS").textContent = "Sin coordenadas";
  } catch (err) {
    console.error(err);
    mostrarAlerta("danger", err.message || "No se pudo guardar el parte diario.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<i class="bi bi-check-circle-fill"></i> Guardar Parte Diario`;
  }
});

document.getElementById("btnLogout").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
});

initParteDiario();
</script>
</body>
</html>
