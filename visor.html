// 🚀 CARGAR DATOS
async function cargar() {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) { window.location.href = "login.html"; return; }
  const user = sessionData.session.user;

  const fecha = document.getElementById("filterFecha").value;
  const empresa = document.getElementById("filterEmpresa").value;
  const ruta = document.getElementById("filterRuta").value;
  const subtramo = document.getElementById("filterSubtramo").value;
  const subtarea = document.getElementById("filterSubtarea").value;

  let query = supabaseClient.from("informes").select("*").eq("user_id", user.id);

  if (fecha) query = query.eq("fecha", fecha);
  if (empresa) query = query.eq("empresa", empresa);
  if (ruta) query = query.eq("ruta", ruta);
  if (subtramo) query = query.eq("subtramo", subtramo);
  if (subtarea) query = query.eq("tarea", subtarea);

  const { data, error } = await query.order("fecha", { ascending: false });

  if (error) { 
    console.error("Error al cargar de Supabase:", error);
    document.getElementById("contenedor").innerHTML = `<div class="alert alert-danger text-center">Error al cargar los registros: ${error.message}</div>`;
    return; 
  }

  renderInformes(data);
  actualizarMapaVisor(data);
}

// 🗺️ ACTUALIZAR PINES
function actualizarMapaVisor(data) {
  capaMarcadores.clearLayers();
  let bounds = [];

  if (!data || data.length === 0) return;

  data.forEach(r => {
    if (r.latitud !== null && r.latitud !== undefined && r.longitud !== null && r.longitud !== undefined && r.imagenes && r.imagenes.length > 0) {
      let miniaturaUrl = r.imagenes[0];

      let iconoMini = L.divIcon({
        className: '',
        html: `<div class="minipin-container"><img src="${miniaturaUrl}" class="minipin-img"></div>`,
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });

      let marker = L.marker([r.latitud, r.longitud], { icon: iconoMini });

      let contenidoPopup = `
        <div style="text-align: center; max-width: 180px; font-family: sans-serif;">
          <b style="color: #0d6efd;">${r.ruta || ''} - Km ${r.km || ''}</b><br>
          <small style="color: #666;">${r.tarea || ''}</small><br>
          <span class="badge bg-secondary mb-1" style="font-size: 10px;">${r.fecha || ''}</span><br>
          <img src="${miniaturaUrl}" style="width: 150px; height: 100px; object-fit: cover; border-radius: 6px; margin-top: 4px; border: 1px solid #ddd;">
        </div>
      `;

      marker.bindPopup(contenidoPopup);
      capaMarcadores.addLayer(marker);
      bounds.push([r.latitud, r.longitud]);
    }
  });

  if (bounds.length > 0) {
    mapaVisor.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
  }

  setTimeout(() => {
    if (mapaVisor) mapaVisor.invalidateSize();
  }, 300);
}

function actualizarBarraFlotante() {
  const seleccionados = document.querySelectorAll(".seleccionar:checked").length;
  const barra = document.getElementById("barraFlotantePDF");
  const contador = document.getElementById("contadorSeleccionados");

  if (!barra || !contador) return;

  contador.textContent = seleccionados;
  if (seleccionados > 0) {
    barra.classList.add("visible");
  } else {
    barra.classList.remove("visible");
  }
}

});

// 🔄 CONVERTIR IMAGEN
async function getBase64ImageFromURL(url) {
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

// 🖼️ ESTAMPADO DE DATOS EN LA FOTO (CANVAS)
async function procesarFotoConMarcaDeAgua(imagenSrc, datos) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = imagenSrc;

    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');

      ctx.drawImage(img, 0, 0);

      const fontSize = Math.max(16, Math.floor(canvas.width * 0.022));
      const padding = fontSize * 0.8;
      ctx.font = `bold ${fontSize}px sans-serif`;

      let lineas = [
        `Empresa: ${datos.empresa}`,
        `Tarea: ${datos.tarea}`,
        `Ruta: ${datos.ruta} - Km: ${datos.km} (${datos.sentido})`
      ];

      if (datos.incluirObs && datos.observacion) {
        lineas.push(`Obs: ${datos.observacion}`);
      }

      let maxWidth = 0;
      lineas.forEach(linea => {
        const metrics = ctx.measureText(linea);
        if (metrics.width > maxWidth) maxWidth = metrics.width;
      });

      const boxWidth = maxWidth + (padding * 2);
      const lineHeight = fontSize * 1.4;
      const boxHeight = (lineas.length * lineHeight) + (padding * 2);

      const marginFromEdge = canvas.width * 0.02;
      const boxX = marginFromEdge;
      const boxY = canvas.height - boxHeight - marginFromEdge;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

      ctx.fillStyle = '#FFFFFF';
      let currentY = boxY + padding + fontSize;

      lineas.forEach(linea => {
        ctx.fillText(linea, boxX + padding, currentY);
        currentY += lineHeight;
      });

      canvas.toBlob((blob) => {
        resolve(blob);
      }, 'image/jpeg', 0.92);
    };

    img.onerror = (err) => reject(err);
  });
}

// 📲 COMPARTIR WHATSAPP
async function compartirWhatsApp(id) {
  const { data: r } = await supabaseClient.from("informes").select("*").eq("id", id).single();
  if (!r) return;

  const incluirObs = document.getElementById(`obs_${id}`).checked;
  const observacionTexto = incluirObs ? r.observacion : '';

  const datosReporte = {
    empresa: r.empresa || '-',
    tarea: r.tarea || '-',
    ruta: r.ruta || '-',
    km: r.km || '-',
    sentido: r.sentido || '-',
    incluirObs: incluirObs,
    observacion: observacionTexto
  };

  if (r.imagenes && r.imagenes.length > 0) {
    try {
      let archivosParaCompartir = [];

      for (let i = 0; i < r.imagenes.length; i++) {
        const fotoSrc = r.imagenes[i];
        const blobFoto = await procesarFotoConMarcaDeAgua(fotoSrc, datosReporte);
        const file = new File([blobFoto], `Informe_${datosReporte.ruta}_Km_${datosReporte.km}_(${i + 1}).jpg`, { type: 'image/jpeg' });
        archivosParaCompartir.push(file);
      }

      if (navigator.canShare && navigator.canShare({ files: archivosParaCompartir })) {
        await navigator.share({ files: archivosParaCompartir });
        return;
      } else {
        archivosParaCompartir.forEach((file, index) => {
          const url = URL.createObjectURL(file);
          const a = document.createElement('a');
          a.href = url;
          a.download = file.name;
          setTimeout(() => { a.click(); }, index * 300);
        });

        alert(`¡Se procesaron y descargaron las ${archivosParaCompartir.length} fotos con sus marcas de agua!`);
        return;
      }
    } catch (e) {
      console.error("Error al procesar las fotos:", e);
      alert("Hubo un error al procesar las imágenes.");
    }
  } else {
    alert("Este registro no contiene imágenes asociadas.");
  }
}

// 🔧 OBTENER LOGO
async function obtenerLogo() {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) return null;
  const user = sessionData.session.user;

  const { data } = await supabaseClient
    .from("empresas")
    .select("*")
    .eq("user_id", user.id)
    .single();

  return data?.logo || null;
}

// 📄 DIBUJAR INFORME (PDF)
async function dibujarInforme(doc, r, logoBase64, mostrarObservacion = true) {
  doc.setDrawColor(160);
  doc.setLineWidth(0.3);

  let y = 10;

  doc.setFillColor(230, 230, 230);
  doc.rect(10, y, 190, 25, 'FD');
  
  if (logoBase64) {
    const imgProps = doc.getImageProperties(logoBase64);
    const maxWidth = 50;  
    const maxHeight = 20; 
    let w = imgProps.width;
    let h = imgProps.height;
    const scale = Math.min(maxWidth / w, maxHeight / h);
    w *= scale;
    h *= scale;

    const posY = y + (25 - h) / 2;
    doc.addImage(logoBase64, 'PNG', 12, posY, w, h);
  }

  doc.setFontSize(16);
  doc.setFont(undefined, "bold");
  doc.text("INFORME FOTOGRÁFICO", 105, y + 14, { align: "center" });

  y += 30;

  let alturaCaja = mostrarObservacion ? 60 : 35;
  doc.setDrawColor(180);
  doc.rect(10, y, 190, alturaCaja);

  doc.setFillColor(240, 240, 240);
  doc.rect(10, y, 190, 8, 'FD');

  doc.setFontSize(11);
  doc.setFont(undefined, "bold");
  doc.text("DATOS DEL INFORME", 12, y + 6);

  y += 12;
  doc.setFontSize(10);

  const campo = (label, value, x, y) => {
    doc.setFont(undefined, "bold");
    doc.text(label, x, y);
    doc.setFont(undefined, "normal");
    doc.text(value || "-", x + 28, y);
  };

  campo("Fecha:", r.fecha, 12, y);
  campo("Empresa:", r.empresa, 130, y);

  y += 6;
  campo("Ruta:", r.ruta, 12, y);
  campo("Subtramo:", r.subtramo, 130, y);

  y += 6;
  campo("Tarea:", r.tarea, 12, y);
 
  y += 6;
  campo("Sentido:", r.sentido, 12, y);
  campo("Km:", r.km, 130, y);

  y += 8;

  if (mostrarObservacion) {
    doc.setFont(undefined, "bold");
    doc.text("Observación:", 12, y);

    y += 4;
    const obs = doc.splitTextToSize(r.observacion || "-", 180);

    doc.setDrawColor(200);
    doc.rect(12, y, 186, obs.length * 5 + 4);

    doc.setFont(undefined, "normal");
    doc.text(obs, 14, y + 4);

    y += obs.length * 5 + 10;
  } else {
    y += 2;
  }

  doc.setFillColor(240, 240, 240);
  doc.rect(10, y, 190, 8, 'FD');

  doc.setFont(undefined, "bold");
  doc.text("REGISTRO FOTOGRÁFICO", 12, y + 6);

  y += 12;

  const totalFotos = r.imagenes ? r.imagenes.length : 0;
  const marginLeft = 10;
  const anchoUtil = 190;
  const gap = 6;

  let boxWidth = (anchoUtil - gap) / 2;
  let boxHeight = 68;
  let rowStep = boxHeight + 8;

  if (totalFotos === 1) {
    boxWidth = anchoUtil;
    boxHeight = 110;
    rowStep = boxHeight + 10;
  } else if (totalFotos === 2) {
    boxHeight = 78;
    rowStep = boxHeight + 10;
  }

  let x = marginLeft;
  let col = 0;
  const startY = y;

  if (r.imagenes && r.imagenes.length > 0) {
    for (let i = 0; i < r.imagenes.length; i++) {
      const img = r.imagenes[i];
      const esUltima = (i === r.imagenes.length - 1);

      const imgData = await getBase64ImageFromURL(img);
      const imgProps = doc.getImageProperties(imgData);

      let imgWidth = imgProps.width;
      let imgHeight = imgProps.height;

      doc.setFillColor(240, 240, 240);
      doc.rect(x, y, boxWidth, boxHeight, 'F');

      doc.setDrawColor(180);
      doc.rect(x, y, boxWidth, boxHeight);

      const ratio = Math.min(boxWidth / imgWidth, boxHeight / imgHeight);
      imgWidth *= ratio;
      imgHeight *= ratio;

      const offsetX = (boxWidth - imgWidth) / 2;
      const offsetY = (boxHeight - imgHeight) / 2;

      doc.addImage(imgData, 'JPEG', x + offsetX, y + offsetY, imgWidth, imgHeight);

      if (totalFotos === 1) {
        x = marginLeft;
        y += rowStep;
      } else {
        col++;
        if (col % 2 === 0) {
          x = marginLeft;
          y += rowStep;
        } else {
          x = marginLeft + boxWidth + gap;
        }
      }

      if (y + boxHeight > 270 && !esUltima) {
        doc.addPage();
        y = startY; 
        x = marginLeft;
        col = 0;
      }
    }
  }
}

// 📄 PDF INDIVIDUAL (SIN CAMBIOS)
async function generarPDF(id) {
  const { data: r } = await supabaseClient.from("informes").select("*").eq("id", id).single();
  const mostrarObs = document.getElementById(`obs_${id}`).checked;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const logoUrl = await obtenerLogo();
  const logoBase64 = logoUrl ? await getBase64ImageFromURL(logoUrl) : null;
  
  await dibujarInforme(doc, r, logoBase64, mostrarObs);
  doc.save(`informe_${r.fecha}.pdf`);
}

// 📄 PDF MÚLTIPLE POR SELECCIÓN (SIN CAMBIOS)
async function generarPDFMultiple() {
  const checkboxes = document.querySelectorAll(".seleccionar:checked");
  if (checkboxes.length === 0) { alert("Seleccioná al menos un registro"); return; }
  
  const mostrarObsGlobal = document.getElementById("chkGlobalObservacion").checked;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let first = true;

  const logoUrl = await obtenerLogo();
  const logoBase64 = logoUrl ? await getBase64ImageFromURL(logoUrl) : null;
  
  for (const chk of checkboxes) {
    const id = chk.value;
    const { data: r } = await supabaseClient.from("informes").select("*").eq("id", id).single();
    if (!r) continue;
    if (!first) doc.addPage();
    
    await dibujarInforme(doc, r, logoBase64, mostrarObsGlobal);
    first = false;
  }
  doc.save("informe_multiple.pdf");
}

// 📄 PDF UNIFICADO POR RANGO DE FECHAS
async function generarPDFRangoFechas() {
  const fechaDesde = document.getElementById("rangoFechaDesde").value;
  const fechaHasta = document.getElementById("rangoFechaHasta").value;

  if (!fechaDesde || !fechaHasta) {
    alert("Completá la fecha inicial y la fecha final para generar el PDF unificado.");
    return;
  }

  if (fechaDesde > fechaHasta) {
    alert("La 'Fecha desde' no puede ser mayor que la 'Fecha hasta'.");
    return;
  }

  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) {
    window.location.href = "login.html";
    return;
  }
  const user = sessionData.session.user;

  const btn = document.getElementById("btnGenerarRango");
  const textoOriginal = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Generando...`;

  try {
    const empresa = document.getElementById("filterEmpresa").value;
    const ruta = document.getElementById("filterRuta").value;
    const subtramo = document.getElementById("filterSubtramo").value;
    const subtarea = document.getElementById("filterSubtarea").value;

    let query = supabaseClient
      .from("informes")
      .select("*")
      .eq("user_id", user.id)
      .gte("fecha", fechaDesde)
      .lte("fecha", fechaHasta);

    if (empresa) query = query.eq("empresa", empresa);
    if (ruta) query = query.eq("ruta", ruta);
    if (subtramo) query = query.eq("subtramo", subtramo);
    if (subtarea) query = query.eq("tarea", subtarea);

    const { data: registros, error } = await query
      .order("fecha", { ascending: true })
      .order("id", { ascending: true });

    if (error) {
      console.error("Error al consultar rango de fechas:", error);
      alert("No se pudieron obtener los registros del rango: " + error.message);
      return;
    }

    if (!registros || registros.length === 0) {
      alert(`No se encontraron informes entre ${fechaDesde} y ${fechaHasta}.`);
      return;
    }

    const mostrarObsGlobal = document.getElementById("chkGlobalObservacion").checked;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const logoUrl = await obtenerLogo();
    const logoBase64 = logoUrl ? await getBase64ImageFromURL(logoUrl) : null;

    let first = true;
    for (const r of registros) {
      if (!first) doc.addPage();
      await dibujarInforme(doc, r, logoBase64, mostrarObsGlobal);
      first = false;
    }

    doc.save(`informe_desde_${fechaDesde}_hasta_${fechaHasta}.pdf`);
  } catch (e) {
    console.error("Error al generar el PDF unificado por rango:", e);
    alert("Ocurrió un error al generar el PDF unificado.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = textoOriginal;
  }
}

async function eliminarInforme(id) {

    .eq("id", id);

    alert("No se pudo eliminar el registro: " + error.message);
    return;
  }

  alert("Informe eliminado correctamente 🗑️");
  cargar();
}

async function cargarFiltrosSubtareas() {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) return;
  
  const { data, error } = await supabaseClient
    .from("informes")
    .select("tarea")
    .eq("user_id", sessionData.session.user.id);

  const filterSubtarea = document.getElementById("filterSubtarea");
  filterSubtarea.innerHTML = '<option value="">Todos</option>';

  if (error || !data) return;
  
  const unicas = [...new Set(data.map(item => item.tarea).filter(Boolean))].sort();
  
  unicas.forEach(sub => {
    const option = document.createElement("option");
    option.value = sub;
    option.textContent = sub;
    filterSubtarea.appendChild(option);
  });
}

document.querySelectorAll("#filterFecha, #filterEmpresa, #filterRuta, #filterSubtramo, #filterSubtarea")
  .forEach(el => {
    el.addEventListener("change", cargar);
    el.addEventListener("input", cargar);
  });

async function inicializar() {
  await cargarFiltrosSubtareas();
  await cargar();
}
