function obtenerTituloInformePDF() {

function inicializarTituloInformePDF() {
  const inputTitulo = document.getElementById("tituloInformePDF");
  if (!inputTitulo) return;

  const guardado = localStorage.getItem(CLAVE_TITULO_PDF);

// 🏢 OBTENER ORGANIZACIÓN DEL USUARIO DESDE "empresas"
async function obtenerOrganizacionUsuario(userId) {
  const { data, error } = await supabaseClient
    .from("empresas")
    .select("nombre, logo")
    .eq("user_id", userId)
    .limit(1);

  if (error || !data || data.length === 0) {
    console.warn("No se encontró organización asociada al usuario:", error);
    return null;
  }

  return data[0].nombre || null;
}

function aplicarFiltroOrganizacion(query, userId, miOrganizacion) {
  if (miOrganizacion) {
    return query.or(`organizacion_id.eq.${miOrganizacion},user_id.eq.${userId}`);
  }
  return query.eq("user_id", userId);
}

// 🚀 CARGAR DATOS COMPARTIDOS POR ORGANIZACIÓN
async function cargar() {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) { window.location.href = "login.html"; return; }
  const user = sessionData.session.user;
  const miOrganizacion = await obtenerOrganizacionUsuario(user.id);

  const fecha = document.getElementById("filterFecha").value;
  const empresa = document.getElementById("filterEmpresa").value;
  const ruta = document.getElementById("filterRuta").value;
  const subtramo = document.getElementById("filterSubtramo").value;
  const subtarea = document.getElementById("filterSubtarea").value;

  let query = aplicarFiltroOrganizacion(
    supabaseClient.from("informes").select("*"),
    user.id,
    miOrganizacion
  );

  if (fecha) query = query.eq("fecha", fecha);
  if (empresa) query = query.eq("empresa", empresa);
  if (ruta) query = query.eq("ruta", ruta);
  if (subtramo) query = query.eq("subtramo", subtramo);
  if (subtarea) query = query.eq("tarea", subtarea);

  const { data, error } = await query.order("fecha", { ascending: false });

  if (error) { 
    console.error("Error al cargar de Supabase:", error);
    document.getElementById("contenedor").innerHTML = `<div class="alert alert-danger text-center">Error al cargar los registros: ${error.message}</div>`;
    return; 
  }

  renderInformes(data);
  actualizarMapaVisor(data);
}

// 🗺️ ACTUALIZAR PINES
function actualizarMapaVisor(data) {
  capaMarcadores.clearLayers();
  let bounds = [];

  if (!data || data.length === 0) return;

  data.forEach(r => {
    if (r.latitud !== null && r.latitud !== undefined && r.longitud !== null && r.longitud !== undefined && r.imagenes && r.imagenes.length > 0) {
      let miniaturaUrl = r.imagenes[0];

      let iconoMini = L.divIcon({
        className: '',
        html: `<div class="minipin-container"><img src="${miniaturaUrl}" class="minipin-img"></div>`,
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });

      let marker = L.marker([r.latitud, r.longitud], { icon: iconoMini });

      let contenidoPopup = `
        <div style="text-align: center; max-width: 180px; font-family: sans-serif;">
          <b style="color: #0d6efd;">${r.ruta || ''} - Km ${r.km || ''}</b><br>
          <small style="color: #666;">${r.tarea || ''}</small><br>
          <span class="badge bg-secondary mb-1" style="font-size: 10px;">${r.fecha || ''}</span><br>
          <img src="${miniaturaUrl}" style="width: 150px; height: 100px; object-fit: cover; border-radius: 6px; margin-top: 4px; border: 1px solid #ddd;">
        </div>
      `;

      marker.bindPopup(contenidoPopup);
      capaMarcadores.addLayer(marker);
      bounds.push([r.latitud, r.longitud]);
    }
  });

  if (bounds.length > 0) {
    mapaVisor.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
  }

  setTimeout(() => {
    if (mapaVisor) mapaVisor.invalidateSize();
  }, 300);
}

function actualizarBarraFlotante() {
  const seleccionados = document.querySelectorAll(".seleccionar:checked").length;
  const barra = document.getElementById("barraFlotantePDF");
  const contador = document.getElementById("contadorSeleccionados");

  if (!barra || !contador) return;

  contador.textContent = seleccionados;
  if (seleccionados > 0) {
    barra.classList.add("visible");
  } else {
    barra.classList.remove("visible");
  }
}

document.addEventListener("change", (e) => {
  if (e.target && e.target.classList.contains("seleccionar")) {
    actualizarBarraFlotante();
  }
});

// 🔄 CONVERTIR IMAGEN
async function getBase64ImageFromURL(url) {
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

// 🖼️ ESTAMPADO DE DATOS EN LA FOTO (CANVAS)
async function procesarFotoConMarcaDeAgua(imagenSrc, datos) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = imagenSrc;

    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');

      ctx.drawImage(img, 0, 0);

      const fontSize = Math.max(16, Math.floor(canvas.width * 0.022));
      const padding = fontSize * 0.8;
      ctx.font = `bold ${fontSize}px sans-serif`;

      let lineas = [
        `Empresa: ${datos.empresa}`,
        `Tarea: ${datos.tarea}`,
        `Ruta: ${datos.ruta} - Km: ${datos.km} (${datos.sentido})`
      ];

      if (datos.incluirObs && datos.observacion) {
        lineas.push(`Obs: ${datos.observacion}`);
      }

      let maxWidth = 0;
      lineas.forEach(linea => {
        const metrics = ctx.measureText(linea);
        if (metrics.width > maxWidth) maxWidth = metrics.width;
      });

      const boxWidth = maxWidth + (padding * 2);
      const lineHeight = fontSize * 1.4;
      const boxHeight = (lineas.length * lineHeight) + (padding * 2);

      const marginFromEdge = canvas.width * 0.02;
      const boxX = marginFromEdge;
      const boxY = canvas.height - boxHeight - marginFromEdge;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

      ctx.fillStyle = '#FFFFFF';
      let currentY = boxY + padding + fontSize;

      lineas.forEach(linea => {
        ctx.fillText(linea, boxX + padding, currentY);
        currentY += lineHeight;
      });

      canvas.toBlob((blob) => {
        resolve(blob);
      }, 'image/jpeg', 0.92);
    };

    img.onerror = (err) => reject(err);
  });
}

// 📲 COMPARTIR WHATSAPP
async function compartirWhatsApp(id) {
  const { data: r } = await supabaseClient.from("informes").select("*").eq("id", id).single();
  if (!r) return;

  const incluirObs = document.getElementById(`obs_${id}`).checked;
  const observacionTexto = incluirObs ? r.observacion : '';

  const datosReporte = {
    empresa: r.empresa || '-',
    tarea: r.tarea || '-',
    ruta: r.ruta || '-',
    km: r.km || '-',
    sentido: r.sentido || '-',
    incluirObs: incluirObs,
    observacion: observacionTexto
  };

  if (r.imagenes && r.imagenes.length > 0) {
    try {
      let archivosParaCompartir = [];

      for (let i = 0; i < r.imagenes.length; i++) {
        const fotoSrc = r.imagenes[i];
        const blobFoto = await procesarFotoConMarcaDeAgua(fotoSrc, datosReporte);
        const file = new File([blobFoto], `Informe_${datosReporte.ruta}_Km_${datosReporte.km}_(${i + 1}).jpg`, { type: 'image/jpeg' });
        archivosParaCompartir.push(file);
      }

      if (navigator.canShare && navigator.canShare({ files: archivosParaCompartir })) {
        await navigator.share({ files: archivosParaCompartir });
        return;
      } else {
        archivosParaCompartir.forEach((file, index) => {
          const url = URL.createObjectURL(file);
          const a = document.createElement('a');
          a.href = url;
          a.download = file.name;
          setTimeout(() => { a.click(); }, index * 300);
        });

        alert(`¡Se procesaron y descargaron las ${archivosParaCompartir.length} fotos con sus marcas de agua!`);
        return;
      }
    } catch (e) {
      console.error("Error al procesar las fotos:", e);
      alert("Hubo un error al procesar las imágenes.");
    }
  } else {
    alert("Este registro no contiene imágenes asociadas.");
  }
}

// 🔧 OBTENER LOGO DE LA ORGANIZACIÓN
async function obtenerLogo() {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) return null;
  const user = sessionData.session.user;
  const miOrganizacion = await obtenerOrganizacionUsuario(user.id);

  if (miOrganizacion) {
    const { data: porOrg } = await supabaseClient
      .from("empresas")
      .select("logo")
      .eq("nombre", miOrganizacion)
      .not("logo", "is", null)
      .limit(1);

    if (porOrg && porOrg.length > 0 && porOrg[0].logo) {
      return porOrg[0].logo;
    }
  }

  const { data } = await supabaseClient
    .from("empresas")
    .select("logo")
    .eq("user_id", user.id)
    .limit(1);

  return data && data.length > 0 ? (data[0].logo || null) : null;
}

// 📄 NUMERAR PÁGINAS DEL PDF
function agregarNumeracionPaginas(doc) {
  const totalPages = doc.getNumberOfPages();
  doc.setFontSize(8.5);
  doc.setFont(undefined, "normal");
  doc.setTextColor(110, 110, 110);

  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    doc.text(`Página ${i} de ${totalPages}`, 200, 290, { align: "right" });
  }
  doc.setTextColor(0, 0, 0);
}

// 📄 DIBUJAR INFORME (PDF AGRUPADO POR TAREA)
async function dibujarInforme(doc, r, logoBase64, mostrarObservacion = true, tituloPersonalizado = null) {
  const pageWidth = 210;
  const marginX = 10;
  const contentWidth = pageWidth - marginX * 2; // 190 mm
  const colRightX = 118;
  const colRightValX = 138;
  const colLeftValX = 31;
  const colLeftMaxWidth = colRightX - colLeftValX - 4; // ~83 mm con separación extra
  const colRightMaxWidth = marginX + contentWidth - colRightValX - 2; // ~60 mm
  const lineStep = 4.8;

  doc.setDrawColor(150);
  doc.setLineWidth(0.3);

  let y = 10;

  // Encabezado
  doc.setFillColor(235, 238, 242);
  doc.rect(marginX, y, contentWidth, 24, 'FD');

  if (logoBase64) {
    try {
      const imgProps = doc.getImageProperties(logoBase64);
      const maxWidth = 44;
      const maxHeight = 19;
      let w = imgProps.width;
      let h = imgProps.height;
      const scale = Math.min(maxWidth / w, maxHeight / h);
      w *= scale;
      h *= scale;
      const posY = y + (24 - h) / 2;
      doc.addImage(logoBase64, 'PNG', marginX + 3, posY, w, h);
    } catch (e) {
      console.warn("No se pudo dibujar el logo en el PDF:", e);
    }
  }

  const tituloFinal = String(tituloPersonalizado || obtenerTituloInformePDF() || "INFORME FOTOGRÁFICO").trim();
  const maxTituloWidth = 132;
  let fontSizeTitulo = 15;
  doc.setFontSize(fontSizeTitulo);
  doc.setFont(undefined, "bold");
  let tituloLines = doc.splitTextToSize(tituloFinal.toUpperCase(), maxTituloWidth);
  if (tituloLines.length > 2) {
    fontSizeTitulo = 12.5;
    doc.setFontSize(fontSizeTitulo);
    tituloLines = doc.splitTextToSize(tituloFinal.toUpperCase(), maxTituloWidth);
  }

  doc.setTextColor(30, 41, 59);
  const tituloLineHeight = fontSizeTitulo * 0.42;
  const tituloStartY = y + 14.5 - ((tituloLines.length - 1) * tituloLineHeight) / 2;
  doc.text(tituloLines, 128, tituloStartY, { align: "center" });
  doc.setTextColor(0, 0, 0);

  y += 28;

  // Preparar líneas de campos con salto automático para evitar superposiciones
  doc.setFontSize(9.5);
  const tareaLines = doc.splitTextToSize(String(r.tarea || "-"), colLeftMaxWidth);
  const obsLines = mostrarObservacion
    ? doc.splitTextToSize(String(r.observacion || "Sin observaciones"), contentWidth - 8)
    : [];

  const row1Height = Math.max(lineStep, lineStep);
  const row2Height = Math.max(lineStep, lineStep);
  const row3Height = Math.max(lineStep, tareaLines.length * lineStep);
  const row4Height = Math.max(lineStep, lineStep);

  const camposBaseHeight = 10 + row1Height + row2Height + row3Height + row4Height + 3;
  const obsBlockHeight = mostrarObservacion ? (7 + obsLines.length * 4.5 + 6.5) : 0;
  const datosBoxHeight = camposBaseHeight + obsBlockHeight;

  // Contenedor de Datos del Informe
  doc.setDrawColor(175);
  doc.rect(marginX, y, contentWidth, datosBoxHeight);

  doc.setFillColor(242, 244, 247);
  doc.rect(marginX, y, contentWidth, 7.5, 'FD');

  doc.setFontSize(10);
  doc.setFont(undefined, "bold");
  doc.text("DATOS DEL INFORME", marginX + 3, y + 5.2);

  let curY = y + 12;
  doc.setFontSize(9.5);

  const dibujarCampo = (etiqueta, valor, xLabel, xVal, maxW, yPos) => {
    doc.setFont(undefined, "bold");
    doc.text(etiqueta, xLabel, yPos);
    doc.setFont(undefined, "normal");
    const lineas = doc.splitTextToSize(String(valor || "-"), maxW);
    doc.text(lineas, xVal, yPos);
    return lineas.length * lineStep;
  };

  // Fila 1: Fecha | Empresa
  dibujarCampo("Fecha:", r.fecha, marginX + 3, colLeftValX, colLeftMaxWidth, curY);
  dibujarCampo("Empresa:", r.empresa, colRightX, colRightValX, colRightMaxWidth, curY);
  curY += row1Height;

  // Fila 2: Ruta | Subtramo
  dibujarCampo("Ruta:", r.ruta, marginX + 3, colLeftValX, colLeftMaxWidth, curY);
  dibujarCampo("Subtramo:", r.subtramo, colRightX, colRightValX, colRightMaxWidth, curY);
  curY += row2Height;

  // Fila 3: Tarea | Km
  dibujarCampo("Tarea:", r.tarea, marginX + 3, colLeftValX, colLeftMaxWidth, curY);
  dibujarCampo("Km:", r.km, colRightX, colRightValX, colRightMaxWidth, curY);
  curY += row3Height;

  // Fila 4: Sentido
  dibujarCampo("Sentido:", r.sentido, marginX + 3, colLeftValX, colLeftMaxWidth, curY);
  curY += row4Height;

  // Observación dentro del bloque de datos con aire extra arriba y abajo
  if (mostrarObservacion) {
    curY += 2;
    doc.setFont(undefined, "bold");
    doc.text("Observación:", marginX + 3, curY);
    curY += 4.5;

    const obsBoxHeight = obsLines.length * 4.5 + 5;
    doc.setDrawColor(205);
    doc.rect(marginX + 3, curY - 2.5, contentWidth - 6, obsBoxHeight);

    doc.setFont(undefined, "normal");
    doc.text(obsLines, marginX + 5, curY + 1.2);
  }

  y += datosBoxHeight + 5;

  // Título Registro Fotográfico
  doc.setDrawColor(175);
  doc.setFillColor(242, 244, 247);
  doc.rect(marginX, y, contentWidth, 7.5, 'FD');

  doc.setFontSize(10);
  doc.setFont(undefined, "bold");
  doc.text("REGISTRO FOTOGRÁFICO", marginX + 3, y + 5.2);

  y += 10.5;

  const imagenes = Array.isArray(r.imagenes) ? r.imagenes.filter(Boolean) : [];
  const totalFotos = imagenes.length;
  if (totalFotos === 0) return;

  const footerReserve = 12; // Margen inferior antes del pie de página (290 mm)
  const availableHeight = 290 - footerReserve - y;
  const gap = 5;

  // Calcular dimensiones según cantidad de fotos para que entren sin desbordar
  let boxWidth = (contentWidth - gap) / 2;
  let boxHeight = 68;
  let rowStep = boxHeight + gap;
  let singleCentered = false;

  if (totalFotos === 1) {
    singleCentered = true;
    boxWidth = contentWidth * 0.85;
    boxHeight = Math.min(115, Math.max(70, availableHeight - 4));
    rowStep = boxHeight + gap;
  } else if (totalFotos === 2) {
    boxHeight = Math.min(82, Math.max(55, availableHeight - 4));
    rowStep = boxHeight + gap;
  } else {
    // 3 o 4 fotos: 2 columnas x 2 filas dentro del alto disponible
    boxHeight = Math.min(68, Math.max(48, Math.floor((availableHeight - gap) / 2)));
    rowStep = boxHeight + gap;
  }

  let x = singleCentered ? marginX + (contentWidth - boxWidth) / 2 : marginX;
  let col = 0;
  const startY = y;

  for (let i = 0; i < totalFotos; i++) {
    const imgUrl = imagenes[i];
    const esUltima = (i === totalFotos - 1);

    if (!singleCentered && y + boxHeight > 290 - footerReserve) {
      doc.addPage();
      y = 14;
      x = marginX;
      col = 0;
    }

    try {
      const imgData = await getBase64ImageFromURL(imgUrl);
      const imgProps = doc.getImageProperties(imgData);

      let imgWidth = imgProps.width;
      let imgHeight = imgProps.height;

      doc.setFillColor(245, 247, 250);
      doc.rect(x, y, boxWidth, boxHeight, 'F');

      doc.setDrawColor(185);
      doc.rect(x, y, boxWidth, boxHeight);

      const innerPad = 1.5;
      const maxW = boxWidth - innerPad * 2;
      const maxH = boxHeight - innerPad * 2;
      const ratio = Math.min(maxW / imgWidth, maxH / imgHeight);
      imgWidth *= ratio;
      imgHeight *= ratio;

      const offsetX = x + (boxWidth - imgWidth) / 2;
      const offsetY = y + (boxHeight - imgHeight) / 2;

      doc.addImage(imgData, 'JPEG', offsetX, offsetY, imgWidth, imgHeight);
    } catch (err) {
      console.warn("Error cargando imagen para PDF:", imgUrl, err);
      doc.setFillColor(250, 240, 240);
      doc.rect(x, y, boxWidth, boxHeight, 'F');
      doc.setDrawColor(200);
      doc.rect(x, y, boxWidth, boxHeight);
      doc.setFontSize(8.5);
      doc.text("Imagen no disponible", x + boxWidth / 2, y + boxHeight / 2, { align: "center" });
    }

    if (singleCentered) {
      y += rowStep;
    } else {
      col++;
      if (col % 2 === 0) {
        x = marginX;
        y += rowStep;
      } else {
        x = marginX + boxWidth + gap;
      }
    }

    if (y + boxHeight > 290 - footerReserve && !esUltima && singleCentered) {
      doc.addPage();
      y = startY;
      x = marginX + (contentWidth - boxWidth) / 2;
    }
  }
}

// 📄 PDF INDIVIDUAL
async function generarPDF(id) {
  const { data: r } = await supabaseClient.from("informes").select("*").eq("id", id).single();
  const mostrarObs = document.getElementById(`obs_${id}`).checked;
  const tituloPDF = obtenerTituloInformePDF();

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const logoUrl = await obtenerLogo();
  const logoBase64 = logoUrl ? await getBase64ImageFromURL(logoUrl) : null;
  
  await dibujarInforme(doc, r, logoBase64, mostrarObs, tituloPDF);
  agregarNumeracionPaginas(doc);
  doc.save(`informe_${r.fecha}.pdf`);
}

// 📄 PDF MÚLTIPLE POR SELECCIÓN
async function generarPDFMultiple() {
  const checkboxes = document.querySelectorAll(".seleccionar:checked");
  if (checkboxes.length === 0) { alert("Seleccioná al menos un registro"); return; }
  
  const mostrarObsGlobal = document.getElementById("chkGlobalObservacion").checked;
  const tituloPDF = obtenerTituloInformePDF();

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let first = true;

  const logoUrl = await obtenerLogo();
  const logoBase64 = logoUrl ? await getBase64ImageFromURL(logoUrl) : null;
  
  for (const chk of checkboxes) {
    const id = chk.value;
    const { data: r } = await supabaseClient.from("informes").select("*").eq("id", id).single();
    if (!r) continue;
    if (!first) doc.addPage();
    
    await dibujarInforme(doc, r, logoBase64, mostrarObsGlobal, tituloPDF);
    first = false;
  }
  agregarNumeracionPaginas(doc);
  doc.save("informe_multiple.pdf");
}

// 📄 PDF UNIFICADO POR RANGO DE FECHAS
async function generarPDFRangoFechas() {
  const fechaDesde = document.getElementById("rangoFechaDesde").value;
  const fechaHasta = document.getElementById("rangoFechaHasta").value;

  if (!fechaDesde || !fechaHasta) {
    alert("Completá la fecha inicial y la fecha final para generar el PDF unificado.");
    return;
  }

  if (fechaDesde > fechaHasta) {
    alert("La 'Fecha desde' no puede ser mayor que la 'Fecha hasta'.");
    return;
  }

  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) {
    window.location.href = "login.html";
    return;
  }
  const user = sessionData.session.user;
  const miOrganizacion = await obtenerOrganizacionUsuario(user.id);

  const btn = document.getElementById("btnGenerarRango");
  const textoOriginal = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Generando...`;

  try {
    const empresa = document.getElementById("filterEmpresa").value;
    const ruta = document.getElementById("filterRuta").value;
    const subtramo = document.getElementById("filterSubtramo").value;
    const subtarea = document.getElementById("filterSubtarea").value;

    let query = aplicarFiltroOrganizacion(
      supabaseClient.from("informes").select("*"),
      user.id,
      miOrganizacion
    )
      .gte("fecha", fechaDesde)
      .lte("fecha", fechaHasta);

    if (empresa) query = query.eq("empresa", empresa);
    if (ruta) query = query.eq("ruta", ruta);
    if (subtramo) query = query.eq("subtramo", subtramo);
    if (subtarea) query = query.eq("tarea", subtarea);

    const { data: registros, error } = await query
      .order("fecha", { ascending: true })
      .order("id", { ascending: true });

    if (error) {
      console.error("Error al consultar rango de fechas:", error);
      alert("No se pudieron obtener los registros del rango: " + error.message);
      return;
    }

    if (!registros || registros.length === 0) {
      alert(`No se encontraron informes entre ${fechaDesde} y ${fechaHasta}.`);
      return;
    }

    const mostrarObsGlobal = document.getElementById("chkGlobalObservacion").checked;
    const tituloPDF = obtenerTituloInformePDF();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const logoUrl = await obtenerLogo();
    const logoBase64 = logoUrl ? await getBase64ImageFromURL(logoUrl) : null;

    let first = true;
    for (const r of registros) {
      if (!first) doc.addPage();
      await dibujarInforme(doc, r, logoBase64, mostrarObsGlobal, tituloPDF);
      first = false;
    }

    agregarNumeracionPaginas(doc);
    doc.save(`informe_desde_${fechaDesde}_hasta_${fechaHasta}.pdf`);
  } catch (e) {
    console.error("Error al generar el PDF unificado por rango:", e);
    alert("Ocurrió un error al generar el PDF unificado.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = textoOriginal;
  }
}

async function editarInforme(id) {
  localStorage.setItem("editandoInforme", id);

  try {
    const { data, error } = await supabaseClient
      .from("informes")
      .select("id, latitud, longitud")
      .eq("id", id)
      .single();

    if (!error && data) {
      localStorage.setItem("editandoInformeCoords", JSON.stringify({
        id: data.id,
        latitud: data.latitud ?? null,
        longitud: data.longitud ?? null
      }));
    } else {
      localStorage.removeItem("editandoInformeCoords");
    }
  } catch (e) {
    console.warn("No se pudieron precargar las coordenadas del informe:", e);
    localStorage.removeItem("editandoInformeCoords");
  }

  window.location.href = "index.html";
}

async function cargarFiltrosSubtareas() {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) return;
  const user = sessionData.session.user;
  const miOrganizacion = await obtenerOrganizacionUsuario(user.id);

  const query = aplicarFiltroOrganizacion(
    supabaseClient.from("informes").select("tarea"),
    user.id,
    miOrganizacion
  );

  const { data, error } = await query;

  const filterSubtarea = document.getElementById("filterSubtarea");
  filterSubtarea.innerHTML = '<option value="">Todos</option>';

  if (error || !data) return;
  
  const unicas = [...new Set(data.map(item => item.tarea).filter(Boolean))].sort();
  
  unicas.forEach(sub => {
    const option = document.createElement("option");
    option.value = sub;
    option.textContent = sub;
    filterSubtarea.appendChild(option);
  });
}
