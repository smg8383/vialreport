function mostrarAlerta(tipo, mensaje) {
  const el = document.getElementById("alertaVisor");
  el.className = `alert alert-${tipo} py-2 px-3 small`;
  el.textContent = mensaje;
  el.classList.remove("d-none");
}

function ocultarAlerta() {
  const el = document.getElementById("alertaVisor");
  el.classList.add("d-none");
}

function escaparHTML(texto) {
  if (texto == null) return "";
  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function badgeEstado(estado) {
  const est = (estado || "").trim();
  if (est === "Finalizada") {
    return `<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">${escaparHTML(est)}</span>`;
  }
  if (est === "Parcial / Pendiente") {
    return `<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded-pill">${escaparHTML(est)}</span>`;
  }
  return `<span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill">${escaparHTML(est || "En ejecución")}</span>`;
}

function formatearAvance(parte) {
  const cant = parte.avance_cantidad;
  const un = parte.avance_unidad || "";
  if (cant == null || cant === "") return un ? un : "—";
  return `${cant} ${un}`.trim();
}

function poblarSelectFiltro(idSelect, valores) {
  const select = document.getElementById(idSelect);
  const actual = select.value;
  const primeraOpcion = select.options[0]?.outerHTML || `<option value="">Todos</option>`;
  const unicos = Array.from(new Set(valores.map(v => (v || "").trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b, "es"));

  select.innerHTML = primeraOpcion;
  unicos.forEach((val) => {
    const opt = document.createElement("option");
    opt.value = val;
    opt.textContent = val;
    select.appendChild(opt);
  });

  if (actual && unicos.includes(actual)) {
    select.value = actual;
  }
}

function actualizarKPIs(lista) {
  document.getElementById("kpiTotal").textContent = lista.length;

  const finalizados = lista.filter(p => (p.estado || "").trim() === "Finalizada").length;
  const activos = lista.filter(p => (p.estado || "").trim() !== "Finalizada").length;

  document.getElementById("kpiFinalizados").textContent = finalizados;
  document.getElementById("kpiActivos").textContent = activos;

  const acumPorUnidad = {};
  lista.forEach((p) => {
    const num = Number(p.avance_cantidad);
    if (!Number.isFinite(num) || p.avance_cantidad === null || p.avance_cantidad === "") return;
    const unidad = (p.avance_unidad || "sin unidad").trim();
    acumPorUnidad[unidad] = (acumPorUnidad[unidad] || 0) + num;
  });

  const claves = Object.keys(acumPorUnidad);
  if (claves.length === 0) {
    document.getElementById("kpiAvances").textContent = "Sin cantidades";
  } else {
    document.getElementById("kpiAvances").innerHTML = claves
      .map(u => `${Number(acumPorUnidad[u].toFixed(2))} ${escaparHTML(u)}`)
      .join(" · ");
  }
}

function renderTarjetas(lista) {
  const cont = document.getElementById("vistaTarjetas");
  if (!lista.length) {
    cont.innerHTML = `
      <div class="col-12">
        <div class="card">
          <div class="card-body text-center py-5 text-muted">
            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
            No hay partes diarios que coincidan con los filtros seleccionados.
          </div>
        </div>
      </div>
    `;
    return;
  }

  cont.innerHTML = lista.map((p) => {
    const fotos = Array.isArray(p.imagenes) ? p.imagenes.filter(Boolean) : [];
    const tieneGPS = p.latitud != null && p.longitud != null && !Number.isNaN(Number(p.latitud)) && !Number.isNaN(Number(p.longitud));
    const linkMaps = tieneGPS
      ? `https://www.google.com/maps?q=${encodeURIComponent(p.latitud)},${encodeURIComponent(p.longitud)}`
      : null;

    return `
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
              <div>
                <div class="fw-bold text-dark">${escaparHTML(p.fecha || "Sin fecha")}</div>
                <div class="small text-muted">
                  ${escaparHTML(p.ruta || "—")} · ${escaparHTML(p.subtramo || "—")}
                  ${p.km ? ` · <strong>Km ${escaparHTML(p.km)}</strong>` : ""}
                </div>
              </div>
              ${badgeEstado(p.estado)}
            </div>

            <div class="fw-semibold text-primary mb-1">${escaparHTML(p.tarea || "Sin tarea")}</div>

            <div class="small text-secondary mb-2">
              <strong>Avance:</strong> ${escaparHTML(formatearAvance(p))}
              ${p.sentido ? ` · <strong>Sentido:</strong> ${escaparHTML(p.sentido)}` : ""}
            </div>

            ${p.observacion ? `<p class="small text-muted mb-2 flex-grow-1">${escaparHTML(p.observacion)}</p>` : `<div class="flex-grow-1"></div>`}

            ${fotos.length > 0 ? `
              <div class="d-flex flex-wrap gap-2 mb-3">
                ${fotos.slice(0, 4).map((url, idx) => `
                  <img
                    src="${escaparHTML(url)}"
                    alt="Foto ${idx + 1}"
                    class="parte-foto-thumb"
                    onclick="abrirDetalleParte('${escaparHTML(p.id)}')"
                  >
                `).join("")}
              </div>
            ` : ""}

            <div class="d-flex justify-content-between align-items-center pt-2 border-top mt-auto">
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="abrirDetalleParte('${escaparHTML(p.id)}')">
                  <i class="bi bi-eye"></i> Detalle
                </button>
                ${linkMaps ? `
                  <a href="${linkMaps}" target="_blank" rel="noopener" class="btn btn-outline-info btn-sm rounded-pill px-2" title="Ver en Google Maps">
                    <i class="bi bi-geo-alt"></i>
                  </a>
                ` : ""}
              </div>

              <button type="button" class="btn btn-outline-danger btn-sm rounded-pill px-2" onclick="eliminarParte('${escaparHTML(p.id)}')" title="Eliminar parte">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function renderTabla(lista) {
  const tbody = document.getElementById("cuerpoTablaPartes");
  if (!lista.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="text-center py-4 text-muted">
          No hay partes diarios que coincidan con los filtros seleccionados.
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = lista.map((p) => {
    const fotos = Array.isArray(p.imagenes) ? p.imagenes.filter(Boolean) : [];
    return `
      <tr>
        <td class="text-nowrap fw-semibold">${escaparHTML(p.fecha || "—")}</td>
        <td>
          <div>${escaparHTML(p.ruta || "—")}</div>
          <small class="text-muted">${escaparHTML(p.subtramo || "—")}</small>
        </td>
        <td class="text-nowrap">${escaparHTML(p.km || "—")}</td>
        <td>${escaparHTML(p.tarea || "—")}</td>
        <td class="text-nowrap fw-semibold">${escaparHTML(formatearAvance(p))}</td>
        <td class="text-nowrap">${badgeEstado(p.estado)}</td>
        <td class="text-nowrap">${fotos.length > 0 ? `<span class="badge bg-secondary-subtle text-dark">${fotos.length} foto(s)</span>` : "—"}</td>
        <td class="text-end text-nowrap">
          <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-2" onclick="abrirDetalleParte('${escaparHTML(p.id)}')">
            <i class="bi bi-eye"></i>
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm rounded-pill px-2" onclick="eliminarParte('${escaparHTML(p.id)}')">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    `;
  }).join("");
}

function aplicarFiltros() {
  const desde = document.getElementById("filtroDesde").value;
  const hasta = document.getElementById("filtroHasta").value;
  const ruta = document.getElementById("filtroRuta").value;
  const subtramo = document.getElementById("filtroSubtramo").value;
  const estado = document.getElementById("filtroEstado").value;
  const tarea = document.getElementById("filtroTarea").value;
  const texto = (document.getElementById("filtroTexto").value || "").trim().toLowerCase();

  partesFiltrados = todosLosPartes.filter((p) => {
    if (desde && (!p.fecha || p.fecha < desde)) return false;
    if (hasta && (!p.fecha || p.fecha > hasta)) return false;
    if (ruta && (p.ruta || "").trim() !== ruta) return false;
    if (subtramo && (p.subtramo || "").trim() !== subtramo) return false;
    if (estado && (p.estado || "").trim() !== estado) return false;
    if (tarea && (p.tarea || "").trim() !== tarea) return false;

    if (texto) {
      const bolsa = [
        p.km,
        p.observacion,
        p.empresa,
        p.sentido,
        p.tarea,
        p.ruta,
        p.subtramo
      ].map(x => String(x || "").toLowerCase()).join(" ");

      if (!bolsa.includes(texto)) return false;
    }

    return true;
  });

  actualizarKPIs(partesFiltrados);
  renderTarjetas(partesFiltrados);
  renderTabla(partesFiltrados);
}

window.abrirDetalleParte = function(id) {
  const parte = todosLosPartes.find(item => String(item.id) === String(id));
  if (!parte) return;

  const fotos = Array.isArray(parte.imagenes) ? parte.imagenes.filter(Boolean) : [];
  const tieneGPS = parte.latitud != null && parte.longitud != null && !Number.isNaN(Number(parte.latitud)) && !Number.isNaN(Number(parte.longitud));
  const linkMaps = tieneGPS
    ? `https://www.google.com/maps?q=${encodeURIComponent(parte.latitud)},${encodeURIComponent(parte.longitud)}`
    : null;

  document.getElementById("contenidoModalDetalle").innerHTML = `
    <div class="row g-3 mb-3 small">
      <div class="col-6 col-md-4"><strong>Fecha:</strong><br>${escaparHTML(parte.fecha || "—")}</div>
      <div class="col-6 col-md-4"><strong>Empresa:</strong><br>${escaparHTML(parte.empresa || "—")}</div>
      <div class="col-6 col-md-4"><strong>Estado:</strong><br>${badgeEstado(parte.estado)}</div>
      <div class="col-6 col-md-4"><strong>Ruta:</strong><br>${escaparHTML(parte.ruta || "—")}</div>
      <div class="col-6 col-md-4"><strong>Subtramo:</strong><br>${escaparHTML(parte.subtramo || "—")}</div>
      <div class="col-6 col-md-4"><strong>Km / Sentido:</strong><br>${escaparHTML(parte.km || "—")} ${parte.sentido ? `(${escaparHTML(parte.sentido)})` : ""}</div>
      <div class="col-12 col-md-8"><strong>Tarea:</strong><br><span class="text-primary fw-semibold">${escaparHTML(parte.tarea || "—")}</span></div>
      <div class="col-12 col-md-4"><strong>Avance:</strong><br><span class="fw-semibold">${escaparHTML(formatearAvance(parte))}</span></div>
    </div>

    <div class="mb-3">
      <div class="small fw-bold text-secondary mb-1">Observación</div>
      <div class="p-2 bg-light rounded small">${escaparHTML(parte.observacion || "Sin observaciones.")}</div>
    </div>

    <div class="mb-3 small">
      <strong>Ubicación GPS:</strong>
      ${tieneGPS
        ? `${Number(parte.latitud).toFixed(5)}, ${Number(parte.longitud).toFixed(5)} — <a href="${linkMaps}" target="_blank" rel="noopener">Abrir en Google Maps</a>`
        : "Sin coordenadas registradas"}
    </div>

    ${fotos.length > 0 ? `
      <div class="small fw-bold text-secondary mb-2">Fotografías (${fotos.length})</div>
      <div class="row g-2">
        ${fotos.map((url, idx) => `
          <div class="col-6 col-md-4">
            <a href="${escaparHTML(url)}" target="_blank" rel="noopener">
              <img src="${escaparHTML(url)}" alt="Foto ${idx + 1}" class="modal-foto-img">
            </a>
          </div>
        `).join("")}
      </div>
    ` : `<div class="small text-muted">Sin fotografías adjuntas.</div>`}
  `;

  const modal = new bootstrap.Modal(document.getElementById("modalDetalleParte"));
  modal.show();
};

window.eliminarParte = async function(id) {
  if (!confirm("¿Seguro que querés eliminar este parte diario?")) return;

  try {
    const { error } = await supabaseClient
      .from("partes_diarios")
      .delete()
      .eq("id", id);

    if (error) throw new Error(error.message);

    todosLosPartes = todosLosPartes.filter(p => String(p.id) !== String(id));
    aplicarFiltros();
    mostrarAlerta("success", "Parte diario eliminado.");
  } catch (err) {
    console.error(err);
    mostrarAlerta("danger", err.message || "No se pudo eliminar el parte diario.");
  }
};

function exportarCSV() {
  if (!partesFiltrados.length) {
    alert("No hay registros filtrados para exportar.");
    return;
  }

  const encabezados = [
    "fecha",
    "empresa",
    "ruta",
    "subtramo",
    "km",
    "sentido",
    "estado",
    "tarea",
    "avance_cantidad",
    "avance_unidad",
    "observacion",
    "latitud",
    "longitud"
  ];

  const escaparCSV = (val) => {
    const str = val == null ? "" : String(val);
    return `"${str.replace(/"/g, '""')}"`;
  };

  const filas = [
    encabezados.map(escaparCSV).join(";"),
    ...partesFiltrados.map(p => encabezados.map(col => escaparCSV(p[col])).join(";"))
  ];

  const blob = new Blob(["\uFEFF" + filas.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `partes_diarios_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function cambiarVista(modo) {
  vistaActual = modo;
  const btnTarjetas = document.getElementById("btnVistaTarjetas");
  const btnTabla = document.getElementById("btnVistaTabla");
  const vistaTarjetas = document.getElementById("vistaTarjetas");
  const vistaTablaWrap = document.getElementById("vistaTablaWrap");

  if (modo === "tabla") {
    btnTabla.classList.add("btn-primary", "active");
    btnTabla.classList.remove("btn-outline-primary");
    btnTarjetas.classList.remove("btn-primary", "active");
    btnTarjetas.classList.add("btn-outline-primary");
    vistaTarjetas.classList.add("d-none");
    vistaTablaWrap.classList.remove("d-none");
  } else {
    btnTarjetas.classList.add("btn-primary", "active");
    btnTarjetas.classList.remove("btn-outline-primary");
    btnTabla.classList.remove("btn-primary", "active");
    btnTabla.classList.add("btn-outline-primary");
    vistaTablaWrap.classList.add("d-none");
    vistaTarjetas.classList.remove("d-none");
  }
}

async function cargarPartesDiarios() {
  ocultarAlerta();

  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) {
    window.location.href = "login.html";
    return;
  }

  usuarioActual = sessionData.session.user;

  const { data: empRows } = await supabaseClient
    .from("empresas")
    .select("nombre")
    .eq("user_id", usuarioActual.id)
    .limit(1);

  organizacionUsuario = empRows && empRows.length > 0 && empRows[0].nombre
    ? String(empRows[0].nombre).trim()
    : null;

  document.getElementById("subtituloOrg").textContent = organizacionUsuario
    ? `Organización: ${organizacionUsuario}`
    : "Registros visibles según permisos de sesión";

  let query = supabaseClient
    .from("partes_diarios")
    .select("*")
    .order("fecha", { ascending: false })
    .order("created_at", { ascending: false });

  if (organizacionUsuario) {
    query = query.eq("organizacion_id", organizacionUsuario);
  }

  const { data, error } = await query;

  if (error) {
    console.error("Error cargando partes diarios:", error);
    mostrarAlerta("danger", "No se pudieron cargar los partes diarios: " + error.message);
    return;
  }

  todosLosPartes = Array.isArray(data) ? data : [];

  poblarSelectFiltro("filtroRuta", todosLosPartes.map(p => p.ruta));
  poblarSelectFiltro("filtroSubtramo", todosLosPartes.map(p => p.subtramo));
  poblarSelectFiltro("filtroTarea", todosLosPartes.map(p => p.tarea));

  aplicarFiltros();
}

[
  "filtroDesde",
  "filtroHasta",
  "filtroRuta",
  "filtroSubtramo",
  "filtroEstado",
  "filtroTarea",
  "filtroTexto"
].forEach((id) => {
  const el = document.getElementById(id);
  el.addEventListener(id === "filtroTexto" ? "input" : "change", aplicarFiltros);
});

document.getElementById("btnLimpiarFiltros").addEventListener("click", () => {
  document.getElementById("filtroDesde").value = "";
  document.getElementById("filtroHasta").value = "";
  document.getElementById("filtroRuta").value = "";
  document.getElementById("filtroSubtramo").value = "";
  document.getElementById("filtroEstado").value = "";
  document.getElementById("filtroTarea").value = "";
  document.getElementById("filtroTexto").value = "";
  aplicarFiltros();
});

document.getElementById("btnVistaTarjetas").addEventListener("click", () => cambiarVista("tarjetas"));
document.getElementById("btnVistaTabla").addEventListener("click", () => cambiarVista("tabla"));
document.getElementById("btnExportarCSV").addEventListener("click", exportarCSV);

document.getElementById("btnLogout").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
});

cargarPartesDiarios();
</script>
